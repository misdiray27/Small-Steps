const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(p,o={}){const r=await fetch(API+p,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});const d=await r.json().catch(()=>({detail:'Invalid response'}));if(!r.ok){let msg=d.detail;if(Array.isArray(msg))msg=msg.map(x=>x.msg||x.message||String(x)).join(' ');if(msg&&typeof msg==='object')msg=msg.message||msg.msg||JSON.stringify(msg);throw Error(msg||d.error||'Request failed')}return d}
function auth(step=0,s={}){document.getElementById('root').innerHTML=`<div class=auth><div class=brand><div class=logo><img src="assets/small-steps-logo.png" alt="Small Steps"></div><h1>A calmer place to take your next small step.</h1><p class=mut>Talk, check in, meditate, listen, and find one small thing that helps.</p></div><div class=authbox><div class=authcard id=ac></div></div></div>`;areg(step,s)}
function areg(step,s){const c=document.getElementById('ac');window.R={...s};let b='';if(step===0)b=`<h2>Welcome back</h2><p class=small>Log in to continue.</p><div id=er></div><div class=field><label>Email</label><input id=em type=email required></div><div class=field><label>Password</label><input id=pw type=password required></div><button class="btn primary" onclick=login()>Log in</button><button class="btn soft" onclick=areg(1,{}) style="margin-left:7px">Create account</button><br><button class="btn soft" onclick=areg(99,{}) style="margin-top:12px">Forgot password?</button>`;else if(step===99)b=`<h2>Forgot password</h2><p class=small>Enter your email. If it exists, reset instructions will be sent.</p><div id=er></div><div class=field><label>Email</label><input id=fe type=email></div><button class="btn primary" onclick=forgot()>Send reset link</button>`;else{const total=8;b=`<div class=steps>${Array.from({length:8},(_,i)=>`<i class=${i<step?'on':''}></i>`).join('')}</div>`;if(step===1)b+=`<h2>Create your account</h2><p class=small>Step 1 of 8</p><div id=regerr></div><div class=field><label>Full name</label><input id=rn></div><div class=field><label>Email</label><input id=re type=email></div><div class=field><label>Password</label><input id=rp type=password minlength=6 required oninput=checkPasswordHint()><div id=phint class=small style="margin-top:6px">Password must be at least 6 characters.</div></div><div class=field><label>Confirm password</label><input id=rc type=password minlength=6 required oninput=checkPasswordHint()></div><button class="btn primary" onclick=nreg(2)>Continue</button>`;if(step===2)b+=`<h2>What's typically the biggest source of stress for you?</h2><p class=small>Select multiple.</p><div class=choicegrid>${['Money','Work','School / College','Health','Relationships','Family responsibilities','Social life','Future / Career'].map(x=>`<button class="choice ${R.stress?.includes(x)?'sel':''}" onclick="tog(this,'stress','${x}')">${x}</button>`).join('')}</div><div class=field><label>Other cause <span class=small>(optional)</span></label><input id=os value="${esc(R.other||'')}"></div><button class="btn primary" onclick=nreg(3)>Continue</button>`;if(step===3)b+=`<h2>When would you like to meditate?</h2><div class=choicegrid>${['Morning','Afternoon','Night','Not sure yet'].map(x=>`<button class="choice ${R.mt===x?'sel':''}" onclick="one('mt','${x}',4)">${x}</button>`).join('')}</div>`;if(step===4)b+=`<h2>How have you been feeling lately?</h2><div class=choicegrid>${['Good','Stressed','Sad','Indifferent'].map(x=>`<button class="choice ${R.rf===x?'sel':''}" onclick="one('rf','${x}',5)">${x}</button>`).join('')}</div>`;if(step===5)b+=`<h2>What's your experience with meditation?</h2><div class=choicegrid>${['Beginner','Experienced','None'].map(x=>`<button class="choice ${R.me===x?'sel':''}" onclick="one('me','${x}',6)">${x}</button>`).join('')}</div>`;if(step===6)b+=`<h2>What would you like Small Steps to help with?</h2><div class=choicegrid>${['Managing stress','Better sleep','Staying focused','Overthinking','Healthy habits','Feeling less lonely','Study pressure','Just exploring'].map(x=>`<button class="choice ${R.goals?.includes(x)?'sel':''}" onclick="tog(this,'goals','${x}')">${x}</button>`).join('')}</div><button class="btn primary" onclick=nreg(7)>Continue</button>`;if(step===7)b+=`<h2>How do you prefer support?</h2><div class=choicegrid>${['Someone who listens','Practical solutions','Questions that help me think','Activities / distraction','A mixture of everything'].map(x=>`<button class="choice ${R.sp===x?'sel':''}" onclick="one('sp','${x}',8)">${x}</button>`).join('')}</div>`;if(step===8)b+=`<h2>How much time would you like to spend on Small Steps?</h2><p class=mut>We'll use this to keep recommendations realistic for you.</p><div class=choicegrid>${['5 minutes','10 minutes','15 minutes','20 minutes','30 minutes','45 minutes'].map(x=>`<button class="choice ${R.time_spend===x?'sel':''}" onclick="one('time_spend','${x}',9)">⏱ ${x}</button>`).join('')}</div>`;if(step===9)b=`<h2>You're ready 🌿</h2><p class=mut>Your ${esc(R.time_spend||'10 minutes')} preference will guide the size of your daily suggestions.</p><button class="btn primary" onclick=finish()>Enter Small Steps</button>`}c.innerHTML=b}
function tog(b,k,v){R[k]=R[k]||[];R[k]=R[k].includes(v)?R[k].filter(x=>x!==v):[...R[k],v];b.classList.toggle('sel')}function one(k,v,n){R[k]=v;areg(n,R)}function checkPasswordHint(){if(!rp)return;let ok=rp.value.length>=6,same=rc?rp.value===rc.value:false;if(phint)phint.textContent=rp.value.length<6?'Password must be at least 6 characters.':(!same?'Passwords do not match.':'Password looks good.');if(phint)phint.style.color=(ok&&same)?'#2f6b5b':'#934b44'}function nreg(n){if(n===2){R.name=rn.value.trim();R.email=re.value.trim();R.pass=rp.value;R.pass2=rc.value;const e=document.getElementById('regerr');if(!R.name||!R.email)return e.innerHTML='<div class=error>Please complete your name and email.</div>';if(R.pass.length<6)return e.innerHTML='<div class=error>Password must be at least 6 characters.</div>';if(R.pass!==R.pass2)return e.innerHTML='<div class=error>Passwords do not match.</div>'}if(n===3)R.other=os.value.trim();areg(n,R)}async function finish(){try{const d=await api('/api/register',{method:'POST',body:JSON.stringify({full_name:R.name,email:R.email,password:R.pass,confirm_password:R.pass2,user_type:'General User',stress_sources:R.stress||[],other_stress:R.other||null,meditation_time:R.mt||'Not set',recent_feeling:R.rf||'Indifferent',meditation_experience:R.me||'None',goals:R.goals||[],support_preference:R.sp||'A mixture of everything'})});user=d.user;window.smallStepsTime=R.time_spend||'10 minutes';app()}catch(e){alert(e.message)}}async function login(){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({email:em.value,password:pw.value})});user=d.user;window.smallStepsTime=user.time_spend||window.smallStepsTime||'10 minutes';app()}catch(e){er.innerHTML=`<div class=error>${esc(e.message)}</div>`}}async function forgot(){try{const d=await api('/api/forgot-password',{method:'POST',body:JSON.stringify({email:fe.value})});er.innerHTML=`<div class=error style="background:#e9f6ef;color:#245b4c">${esc(d.message)}</div>`}catch(e){er.innerHTML=`<div class=error>${esc(e.message)}</div>`}}
let currentView='home',viewHistory=[];function navigate(v){if(currentView&&currentView!==v)viewHistory.push(currentView);currentView=v;go(v,true)}function goBack(){const prev=viewHistory.pop()||'home';currentView=prev;go(prev,true)}function addBackButton(){if(currentView==='home')return;const m=document.getElementById('main');if(!m)return;const bar=document.createElement('div');bar.className='backbar';bar.innerHTML=`<button class="backbtn" onclick="goBack()">← Back</button><button class="backbtn" onclick="navigate('home')">⌂ Home</button>`;m.prepend(bar)}

function app(){document.getElementById('root').innerHTML=`<nav class=nav><div class=logo><img src="assets/small-steps-logo.png" alt="Small Steps"></div><button onclick=navigate('home')>Home</button><button onclick=navigate('check')>Check-in</button><button onclick=navigate('chat')>Talk with Mio</button><button onclick=navigate('med')>Meditation</button><button onclick=navigate('activities')>Activities</button><button onclick=navigate('games')>Games</button><button onclick=navigate('dash')>Dashboard</button><button onclick=navigate('profile')>Profile</button><button onclick=logout>Log out</button></nav><main id=main></main>`;go('home')}

function localRecommendation(mood,message){const m=(mood||'').toLowerCase(),t=(message||'').toLowerCase(),mins=window.smallStepsTime||'10 minutes';let x;if(m.includes('angry')||t.includes('angry')||t.includes('mad'))x=['🧩','Guided therapy','Anger Pause','activities','A short guided reset to slow the reaction before deciding what to do.'];else if(m.includes('sad')||m.includes('lonely')||t.includes('sad')||t.includes('lonely'))x=['🫶','Activity','Self-Compassion Check','activities','A gentle reflection activity designed for low-energy moments.'];else if(m.includes('stress')||m.includes('anx')||m.includes('overthink')||t.includes('stress')||t.includes('anxious')||t.includes('overthink'))x=['🎯','Game','Focus Filter','games','A short focus challenge to give your mind one clear task.'];else if(m.includes('tired')||m.includes('sleep')||t.includes('tired')||t.includes('sleep'))x=['🌙','Music + therapy','Night Calm','med','A low-stimulation session for winding down.'];else if(m.includes('good')||m.includes('happy')||m.includes('positive')||t.includes('happy')||t.includes('good'))x=['⚡','Game','Reflex Rush','games','A quick, upbeat challenge when you have some energy.'];else x=['🌿','Activity','Priority Reset','activities','A simple reset to choose one manageable next step.'];return {icon:x[0],type:x[1],name:x[2],open:x[3],reason:x[4],duration:mins}}

function chat(){main.innerHTML=`<section class="view on"><div class="wrap chatbox"><div class=head><span class=ey>TALK WITH MIO</span><h2>Tell me what actually happened.</h2><p class=mut>Mio can listen, ask follow-up questions, help you think, or suggest a small next step.</p></div><div class=msgs id=msgs><div class="msg m">Hey ${esc(user.full_name.split(' ')[0])}. What's on your mind?</div></div><div class=chatbar><input id=ci placeholder="Type anything..." onkeydown="if(event.key==='Enter')send()"><button class="micbtn" id=micBtn onclick="toggleMic()" title="Speak to Mio">🎙</button><button class="btn primary" onclick=send>Send</button></div><div id=voiceHint class=voicehint>Tap 🎙 and allow microphone access to speak. Your speech is converted to text before sending.</div></div></section>`}
let recognition=null,micListening=false;function getSpeechRecognition(){return window.SpeechRecognition||window.webkitSpeechRecognition}function toggleMic(){const SR=getSpeechRecognition();if(!SR){voiceHint.textContent='Voice input is not supported in this browser. Try Chrome or Edge.';return}if(micListening){recognition&&recognition.stop();return}recognition=new SR();recognition.lang='en-IN';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{micListening=true;micBtn.classList.add('listening');micBtn.textContent='⏹';voiceHint.textContent='Listening… speak now.'};recognition.onresult=e=>{const text=e.results[0][0].transcript||'';ci.value=(ci.value?ci.value+' ':'')+text;voiceHint.textContent='Got it. Press Send or press Enter.'};recognition.onerror=e=>{voiceHint.textContent=e.error==='not-allowed'?'Microphone permission was blocked. Allow microphone access and try again.':'Voice input error. Please try again.'};recognition.onend=()=>{micListening=false;micBtn.classList.remove('listening');micBtn.textContent='🎙'};recognition.start()}async function send(){const t=ci.value.trim();if(!t)return;msgs.insertAdjacentHTML('beforeend',`<div class="msg u">${esc(t)}</div>`);ci.value='';try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({user_id:user.id,message:t,language:'English'})});msgs.insertAdjacentHTML('beforeend',`<div class="msg m">${esc(d.reply)}</div>`);msgs.scrollTop=msgs.scrollHeight}catch{msgs.insertAdjacentHTML('beforeend','<div class="msg m">I cannot reach the AI service right now, but you can still use meditation and check-in.</div>')}}

function pattern(){const base=1+Math.floor(Math.random()*5),step=1+Math.floor(Math.random()*4),arr=[base,base+step,base+2*step,base+3*step];area.innerHTML=`<div class="math-q">${arr.join(' · ')} · ?</div><input id="patInput" class="mega-input" inputmode="numeric"><button class="btn primary" id="patBtn">Submit</button>`;patBtn.onclick=()=>{if(+patInput.value===arr[3]+step){add(15);result.textContent='Pattern solved!';if(activeGameMode==='duo')nextTurn()}else{add(-2);result.textContent=`Answer was ${arr[3]+step}`};setTimeout(pattern,350)}}
function color(){const words=[['RED','🟥'],['BLUE','🟦'],['GREEN','🟩'],['YELLOW','🟨']];const w=words[Math.floor(Math.random()*words.length)],wrong=words.filter(x=>x!==w)[Math.floor(Math.random()*3)];area.innerHTML=`<div class="color-word" style="color:${wrong[0].toLowerCase()}">${w[0]}</div><p class=mut>Click the <b>INK COLOR</b>, not the word.</p><div class=choicegrid>${words.map(x=>`<button class="choice" onclick="this.parentElement.querySelectorAll('.choice').forEach(b=>b.disabled=true);window.megaColorPick('${x[0]}','${wrong[0]}')">${x[1]} ${x[0]}</button>`).join('')}</div>`}
window.megaColorPick=(pick,ans)=>{if(pick===ans){add(12);result.textContent='Correct!'}else{add(-4);result.textContent='Wrong color'};setTimeout(color,350)};
function number(){const n=String(Math.floor(1000+Math.random()*9000));area.innerHTML=`<div class="math-q" id="numShow">${n}</div><input id="numInput" class="mega-input" inputmode="numeric"><button class="btn primary" id="numBtn">Check</button>`;setTimeout(()=>numShow.textContent='••••',800);numBtn.onclick=()=>{if(numInput.value===n){add(15);result.textContent='Correct!';if(activeGameMode==='duo')nextTurn()}else{add(-3);result.textContent='Try again'};setTimeout(number,350)}}
function calm(){let count=5;area.innerHTML=`<div class="calm-circle" id="calmCircle">${count}</div><p class=mut>Tap when the circle reaches zero. Slow is okay.</p>`;const iv=setInterval(()=>{count--;calmCircle.textContent=count;if(count<=0){clearInterval(iv);add(20);result.textContent='Nice pause 🌿';setTimeout(calm,700)}},700)}
({tap,react,memory,focus,math,word,pattern,color,number,calm}[g.engine]||tap)()}
function gameShell(title,body){
main.innerHTML=`<section class="view on"><div class=wrap><div class=head><span class=ey>MENTAL FITNESS LAB</span><h2>${title}</h2></div><div class="card" style="max-width:900px;margin:auto">${body}<div class=actions style="justify-content:center"><button class="btn soft" id="backGames">← Back to games</button></div></div></div></section>`;
document.getElementById('backGames').addEventListener('click',()=>games());
}
function gameHud(score,time,extra=''){return `<div class=hud><span class=tag>Score: <b id=gscore>${score}</b></span><span class=tag>Time: <b id=gtime>${time}</b></span>${extra}</div>`}

let gameTimer=null,gameCleanup=null;
function resetGameRuntime(){if(gameTimer){clearInterval(gameTimer);clearTimeout(gameTimer);gameTimer=null}if(gameCleanup){gameCleanup();gameCleanup=null}}

function targetHunter(){
resetGameRuntime();
gameShell('🎯 Target Hunter',`<p class=mut>Hit 15 targets. Click the gold target as it moves.</p>${gameHud(0,30,'<span class=tag>Hits: <b id=gcombo>0</b>/15</span>')}<div id=targetarena class=game-arena><button id=huntTarget class=game-btn style="position:absolute;width:64px;height:64px;border-radius:50%;background:#d7a64b;color:#123b34;font-size:22px;display:none">+</button><div id=targetstartmsg style="position:absolute;inset:0;display:grid;place-items:center;color:#71958b">Press Start</div></div><h3 id=gresult style="text-align:center"></h3><div class=actions style="justify-content:center"><button class="btn primary" id=startTargetBtn>Start round</button></div>`);
document.getElementById('startTargetBtn').addEventListener('click',startTargetHunter);
}
function startTargetHunter(){
resetGameRuntime();let score=0,hits=0,time=30,active=true;
const a=document.getElementById('targetarena'),t=document.getElementById('huntTarget'),sc=document.getElementById('gscore'),co=document.getElementById('gcombo'),ti=document.getElementById('gtime'),r=document.getElementById('gresult'),sm=document.getElementById('targetstartmsg');
if(!a||!t)return;sm.style.display='none';t.style.display='block';
const move=()=>{t.style.left=Math.max(2,Math.random()*88)+'%';t.style.top=Math.max(2,Math.random()*72)+'%'};
const finish=msg=>{active=false;resetGameRuntime();t.style.display='none';r.textContent=msg};
t.onclick=()=>{if(!active)return;hits++;score+=10;sc.textContent=score;co.textContent=hits;move();if(hits>=15)finish(`MISSION COMPLETE — ${score} points`)};
move();
gameTimer=setInterval(()=>{time--;ti.textContent=time;if(time<=0)finish(`TIME UP — ${score} points`)},1000);
}

function blackoutArrow(){
resetGameRuntime();
gameShell('⬆ Blackout Arrow',`<p class=mut>Match the arrow. Keyboard and on-screen buttons both work.</p>${gameHud(0,30,'<span class=tag>Correct: <b id=arrowHits>0</b>/20</span>')}<div id=arrowarena class=game-arena style="display:grid;place-items:center;color:#d7a64b;font:800 100px Manrope">—</div><div id=arrowcontrols style="display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center;margin:15px auto"><span></span><button class=game-btn data-key="ArrowUp">↑</button><span></span><button class=game-btn data-key="ArrowLeft">←</button><button class=game-btn data-key="ArrowDown">↓</button><button class=game-btn data-key="ArrowRight">→</button></div><h3 id=arrowresult style="text-align:center"></h3><div class=actions style="justify-content:center"><button class="btn primary" id=startArrowBtn>Start round</button></div>`);
document.getElementById('startArrowBtn').addEventListener('click',startBlackout);
document.querySelectorAll('#arrowcontrols [data-key]').forEach(b=>b.addEventListener('click',()=>handleArrow(b.dataset.key)));
}
let arrowState=null;
function startBlackout(){
resetGameRuntime();let score=0,time=30,hits=0,active=true,expected='';
const ar=document.getElementById('arrowarena'),sc=document.getElementById('gscore'),ti=document.getElementById('gtime'),res=document.getElementById('arrowresult'),hit=document.getElementById('arrowHits');
const keys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'],syms={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'};
const next=()=>{expected=keys[Math.floor(Math.random()*4)];ar.textContent=syms[expected];};
arrowState={active,getExpected:()=>expected,onKey:key=>{if(!active)return;if(key===expected){score+=10;hits++;res.textContent='CORRECT';ar.style.color='#b9e0cf';hit.textContent=hits;if(hits>=20){active=false;finishArrow(`ROUND COMPLETE — ${score} points`);return}}else{score=Math.max(0,score-5);res.textContent='WRONG';ar.style.color='#d7a64b'}sc.textContent=score;next();}};
const keyHandler=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();handleArrow(e.key)}};
window.addEventListener('keydown',keyHandler);
gameCleanup=()=>{window.removeEventListener('keydown',keyHandler);arrowState=null};
const finish=()=>{active=false;resetGameRuntime();res.textContent=`ROUND COMPLETE — ${score} points`;ar.textContent='END'};
window.__finishArrow=finish;next();
gameTimer=setInterval(()=>{time--;ti.textContent=time;if(time<=0){finish()}},1000);
}
function handleArrow(key){if(arrowState&&arrowState.active)arrowState.onKey(key)}
function finishArrow(msg){if(arrowState){arrowState.active=false;const r=document.getElementById('arrowresult'),a=document.getElementById('arrowarena');if(r)r.textContent=msg;if(a)a.textContent='END';resetGameRuntime()}}

function treasureHunt(){
resetGameRuntime();
gameShell('🗺 Treasure Hunt',`<p class=mut>Find all 3 hidden treasures. Wrong cells lose 2 points.</p>${gameHud(0,35,'<span class=tag>Found: <b id=treasureFound>0</b>/3</span>')}<div id=treasureboard style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:560px;margin:20px auto"></div><h3 id=treasureresult style="text-align:center"></h3><div class=actions style="justify-content:center"><button class="btn primary" id=startTreasureBtn>Start hunt</button></div>`);
document.getElementById('startTreasureBtn').addEventListener('click',startTreasure);
}
function startTreasure(){
resetGameRuntime();let score=0,found=0,time=35,active=true;
const board=document.getElementById('treasureboard'),sc=document.getElementById('gscore'),ti=document.getElementById('gtime'),fd=document.getElementById('treasureFound'),res=document.getElementById('treasureresult');
if(!board)return;board.innerHTML='';const treasure=[];while(treasure.length<3){let n=Math.floor(Math.random()*30);if(!treasure.includes(n))treasure.push(n)}
const finish=msg=>{active=false;resetGameRuntime();res.textContent=msg};
for(let i=0;i<30;i++){const b=document.createElement('button');b.className='treasure-cell';b.type='button';b.textContent='?';b.addEventListener('click',()=>{if(!active||b.disabled)return;b.disabled=true;if(treasure.includes(i)){b.textContent='◆';b.style.background='#d7a64b';b.style.color='#123b34';found++;score+=25;fd.textContent=found;if(found===3)finish(`TREASURE FOUND — ${score} points`)}else{b.textContent='×';b.style.opacity='.45';score=Math.max(0,score-2)}sc.textContent=score});board.appendChild(b)}
gameTimer=setInterval(()=>{time--;ti.textContent=time;if(time<=0)finish(`HUNT OVER — ${found}/3 found — ${score} points`)},1000);
}

function memoryGrid(){
resetGameRuntime();
gameShell('▦ Memory Grid',`<p class=mut>Memorize the highlighted cells, then click the same cells.</p>${gameHud(0,'—','<span class=tag>Round: <b id=mround>1</b></span>')}<div id=memoryboard style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:20px auto"></div><h3 id=mresult style="text-align:center"></h3><div class=actions style="justify-content:center"><button class="btn primary" id=startMemoryBtn>Start round</button></div>`);
document.getElementById('startMemoryBtn').addEventListener('click',startMemory);
}
function startMemory(){
resetGameRuntime();let round=1,score=0;
const b=document.getElementById('memoryboard'),r=document.getElementById('mresult'),rr=document.getElementById('mround');
function roundStart(){b.innerHTML='';let pattern=[];const count=Math.min(2+round,8);while(pattern.length<count){let n=Math.floor(Math.random()*16);if(!pattern.includes(n))pattern.push(n)}
for(let i=0;i<16;i++){const x=document.createElement('button');x.dataset.i=i;x.type='button';x.style.cssText='height:75px;border:1px solid #dfeae5;border-radius:12px;background:#eef4f1;font-size:20px';b.appendChild(x)}
pattern.forEach(i=>b.children[i].style.background='#d7a64b');
setTimeout(()=>{[...b.children].forEach(x=>x.style.background='#eef4f1');let chosen=[];const click=e=>{const x=e.target;if(!x.dataset.i||x.disabled)return;const n=+x.dataset.i;if(chosen.includes(n))return;chosen.push(n);x.style.background='#2f6b5b';if(chosen.length===pattern.length){const ok=chosen.every(n=>pattern.includes(n));if(ok){score+=10*round;round++;rr.textContent=round;r.textContent=`Correct! Score: ${score}`;setTimeout(roundStart,650)}else{r.textContent=`Game over — score ${score}`;b.removeEventListener('click',click)}}};b.addEventListener('click',click);gameCleanup=()=>b.removeEventListener('click',click)},1200)}
roundStart();
}

function focusFilter(){
resetGameRuntime();
gameShell('◆ Focus Filter',`<p class=mut>Click only ◆. You have 20 seconds.</p>${gameHud(0,20,'<span class=tag>Target: <b>◆</b></span>')}<div id=fboard style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"></div><h3 id=fresult style="text-align:center"></h3><div class=actions style="justify-content:center"><button class="btn primary" id=startFocusBtn>Start round</button></div>`);
document.getElementById('startFocusBtn').addEventListener('click',startFocusFilter);
}
function startFocusFilter(){
resetGameRuntime();let score=0,time=20,active=true;const syms=['◆','◇','●','○','■','□'],target='◆',b=document.getElementById('fboard'),sc=document.getElementById('gscore'),ti=document.getElementById('gtime'),res=document.getElementById('fresult');b.innerHTML='';
for(let i=0;i<42;i++){const x=document.createElement('button');x.className='choice';x.type='button';x.textContent=Math.random()<.22?target:syms[1+Math.floor(Math.random()*(syms.length-1))];x.addEventListener('click',()=>{if(!active)return;if(x.textContent===target){score+=10;x.disabled=true;x.style.opacity='.25'}else score=Math.max(0,score-3);sc.textContent=score});b.appendChild(x)}
const finish=()=>{active=false;resetGameRuntime();res.textContent=`ROUND COMPLETE — ${score} points`};gameTimer=setInterval(()=>{time--;ti.textContent=time;if(time<=0)finish()},1000);
}

function codeBreaker(){
resetGameRuntime();
gameShell('🔐 Code Breaker',`<p class=mut>Find the 3-digit code. The clue tells how many digits are in the correct position.</p>${gameHud(0,60,'<span class=tag>Attempts: <b id=cattempt>0</b></span>')}<div id=clue style="background:#f2f7f4;border-radius:15px;padding:16px;margin:15px 0;font-size:18px">Press Start.</div><input id=guess maxlength=3 inputmode=numeric placeholder="Enter 3 digits" style="padding:13px;border:1px solid #dfeae5;border-radius:12px;width:180px;text-align:center;font-size:20px"><div class=actions style="justify-content:center"><button class="btn primary" id=startCodeBtn>Start</button><button class="btn soft" id=checkCodeBtn>Check</button></div><h3 id=cresult style="text-align:center"></h3>`);
document.getElementById('startCodeBtn').addEventListener('click',startCode);document.getElementById('checkCodeBtn').addEventListener('click',checkCode);
}
function startCode(){window.secretCode=String(Math.floor(100+Math.random()*900));document.getElementById('cattempt').textContent='0';document.getElementById('gtime').textContent='60';document.getElementById('cresult').textContent='';document.getElementById('clue').textContent='Code generated. Start guessing.';let time=60;resetGameRuntime();gameTimer=setInterval(()=>{time--;document.getElementById('gtime').textContent=time;if(time<=0){clearInterval(gameTimer);gameTimer=null;document.getElementById('cresult').textContent=`Time up. Code was ${window.secretCode}.`}},1000)}
function checkCode(){if(!window.secretCode){document.getElementById('cresult').textContent='Press Start first.';return}const input=document.getElementById('guess'),g=input.value.replace(/\D/g,'').slice(0,3);if(g.length!==3){document.getElementById('cresult').textContent='Enter exactly 3 digits.';return}let exact=0;for(let i=0;i<3;i++)if(g[i]===window.secretCode[i])exact++;const attempt=+document.getElementById('cattempt').textContent+1;document.getElementById('cattempt').textContent=attempt;if(g===window.secretCode){document.getElementById('gscore').textContent=Math.max(10,100-attempt*10);document.getElementById('cresult').textContent=`CODE CRACKED — ${window.secretCode}`}else document.getElementById('clue').textContent=`${exact} digit(s) are in the correct position.`}

function reflexRush(){
resetGameRuntime();
gameShell('⚡ Reflex Rush',`<p class=mut>Wait for GO, then click. False starts lose points.</p>${gameHud(0,20)}<button id=reflexBtn style="width:100%;height:240px;border:0;border-radius:20px;background:#162f2a;color:#d7a64b;font:800 36px Manrope">START</button><h3 id=reflexResult style="text-align:center"></h3>`);
document.getElementById('reflexBtn').addEventListener('click',startReflex);
}
function startReflex(){
resetGameRuntime();let score=0,time=20,active=true,ready=false,goAt=0,timer=null;const b=document.getElementById('reflexBtn'),sc=document.getElementById('gscore'),ti=document.getElementById('gtime'),r=document.getElementById('reflexResult');
const cycle=()=>{if(!active)return;ready=false;b.textContent='WAIT';b.style.background='#162f2a';clearTimeout(timer);timer=setTimeout(()=>{ready=true;goAt=performance.now();b.textContent='GO';b.style.background='#2f6b5b'},700+Math.random()*1500)};
b.onclick=()=>{if(!active)return;if(!ready){score=Math.max(0,score-5);r.textContent='FALSE START';sc.textContent=score;cycle();return}const ms=Math.round(performance.now()-goAt);score+=Math.max(5,100-Math.floor(ms/10));sc.textContent=score;r.textContent=ms+' ms';cycle()};
cycle();gameTimer=setInterval(()=>{time--;ti.textContent=time;if(time<=0){active=false;clearInterval(gameTimer);clearTimeout(timer);gameTimer=null;b.textContent='ROUND OVER';r.textContent=`FINAL SCORE — ${score}`}},1000);
}

function numberRecall(){
resetGameRuntime();
gameShell('🔢 Number Recall',`<p class=mut>Memorize the number before it disappears.</p>${gameHud(0,'—','<span class=tag>Round: <b id=nround>1</b></span>')}<div id=nnumber style="font:800 48px Manrope;text-align:center;min-height:70px;padding:20px">Press Start</div><input id=ninput inputmode=numeric placeholder="Type the number" style="display:block;margin:10px auto;padding:13px;border:1px solid #dfeae5;border-radius:12px;text-align:center;font-size:20px"><div class=actions style="justify-content:center"><button class="btn primary" id=startNumberBtn>Start</button><button class="btn soft" id=checkNumberBtn>Check</button></div><h3 id=nresult style="text-align:center"></h3>`);
document.getElementById('startNumberBtn').addEventListener('click',startNumberRecall);document.getElementById('checkNumberBtn').addEventListener('click',checkNumberRecall);
}
function startNumberRecall(){window.recallNumber=String(Math.floor(1000+Math.random()*9000));document.getElementById('nnumber').textContent=window.recallNumber;document.getElementById('ninput').value='';document.getElementById('nresult').textContent='';setTimeout(()=>{const n=document.getElementById('nnumber');if(n)n.textContent='••••••'},1800)}
function checkNumberRecall(){const n=document.getElementById('nresult'),input=document.getElementById('ninput');if(!window.recallNumber){n.textContent='Press Start first.';return}n.textContent=input.value.trim()===window.recallNumber?'Correct! 🎉':'Not quite. Try another round.'}
async function dash(){main.innerHTML=`<section class="view on"><div class=wrap><div class=head><span class=ey>DASHBOARD</span><h2>Small progress still counts.</h2></div><div class=stats><div class=card><strong id=s1>—</strong><span class=small>Check-ins</span></div><div class=card><strong id=s2>—</strong><span class=small>Chat messages</span></div><div class=card><strong id=s3>—</strong><span class=small>Meditation minutes</span></div><div class=card><strong>24</strong><span class=small>Guided sessions</span></div></div></div></section>`;try{const d=await api('/api/dashboard/'+user.id);s1.textContent=d.checkins;s2.textContent=d.chat_messages;s3.textContent=d.meditation_minutes}catch{}}function profile(){main.innerHTML=`<section class="view on"><div class=wrap><div class=head><span class=ey>PROFILE</span><h2>Your preferences, your way.</h2></div><div class=profile><div class=card><h3>Basic details</h3><div class=field><label>Name</label><input id=pn value="${esc(user.full_name)}"></div><div class=field><label>Email</label><input value="${esc(user.email)}" disabled></div><button class="btn primary" onclick=saveProfile>Save</button></div><div class=card><h3>Preferences</h3><div class=field><label>Language</label><select id=lang><option>English</option><option>Hindi</option><option>Hinglish</option></select></div><div class=field><label>Preferred meditation time</label><select id=mt><option>Morning</option><option>Afternoon</option><option>Night</option></select></div><button class="btn soft" onclick=savePrefs>Save preferences</button></div><div class=card><h3>Change password</h3><div class=field><label>Current password</label><input id=old type=password></div><div class=field><label>New password</label><input id=np type=password></div><button class="btn primary" onclick=changePw>Change password</button></div></div></div></section>`}async function saveProfile(){try{let d=await api('/api/profile/'+user.id,{method:'PUT',body:JSON.stringify({full_name:pn.value})});user=d.user;alert('Saved')}catch(e){alert(e.message)}}async function savePrefs(){try{await api('/api/preferences/'+user.id,{method:'PUT',body:JSON.stringify({language:lang.value,meditation_time:mt.value})});alert('Saved')}catch(e){alert(e.message)}}async function changePw(){try{await api('/api/change-password',{method:'POST',body:JSON.stringify({user_id:user.id,old_password:old.value,new_password:np.value})});alert('Password changed')}catch(e){alert(e.message)}}function logout(){stop();user=null;viewHistory=[];currentView='home';auth(0,{})}auth();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Small Steps — Wellness & Mood Activities</title>
<style>
:root{--cream:#fbf8f3;--lav:#e8e0f2;--lav2:#f3eef8;--coral:#e99a87;--navy:#20263b;--sage:#9fb7a4;--white:#fff;--muted:#697084;--line:#e6e1dc;--shadow:0 16px 50px rgba(32,38,59,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.shell{min-height:100vh}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand-panel{padding:8vh 8vw;background:var(--lav);display:flex;flex-direction:column;justify-content:center}.brand-mark{display:flex;align-items:center;gap:12px;font-weight:800;font-size:25px}.mark{width:44px;height:44px;border-radius:15px;background:var(--coral);display:grid;place-items:center;color:#fff}.brand-panel h1{font-size:clamp(42px,5vw,72px);line-height:1.02;margin:35px 0 20px;letter-spacing:-2px}.brand-panel p{max-width:510px;font-size:19px;line-height:1.65;color:#555d72}.mini-note{margin-top:40px;color:#6c6473;font-size:13px;max-width:480px;line-height:1.6}.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px}.auth-card{background:#fff;width:min(480px,100%);padding:38px;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}.tabs{display:flex;background:var(--lav2);padding:5px;border-radius:14px;margin-bottom:28px}.tabs button{flex:1;padding:12px;border-radius:10px;background:transparent;color:var(--muted)}.tabs button.active{background:#fff;color:var(--navy);box-shadow:0 3px 12px #20263b12;font-weight:700}.auth-card h2{margin:0 0 8px;font-size:29px}.sub{color:var(--muted);margin:0 0 25px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid #ddd8d2;border-radius:12px;outline:0;background:#fff}.field input:focus,.field textarea:focus{border-color:#a59bb8;box-shadow:0 0 0 3px #e8e0f266}.primary{background:var(--navy);color:#fff;padding:14px 20px;border-radius:12px;font-weight:750;width:100%;margin-top:8px}.secondary{background:var(--lav2);color:var(--navy);padding:11px 16px;border-radius:11px;font-weight:700}.tiny{font-size:12px;color:var(--muted);line-height:1.5}.error{color:#a63d36;background:#fff0ed;border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}.appbar{height:74px;background:rgba(251,248,243,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}.nav{display:flex;gap:8px;align-items:center}.nav button{background:transparent;padding:9px 12px;border-radius:10px;color:var(--muted)}.nav button.active{background:var(--lav2);color:var(--navy);font-weight:700}.user-chip{font-size:13px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:20px}.page{max-width:1180px;margin:auto;padding:48px 5vw}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:25px;align-items:stretch}.hero-card,.soft-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:0 10px 35px #20263b0a}.hero-card{background:var(--lav2)}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800;color:#776d82}.hero h1{font-size:clamp(35px,5vw,60px);letter-spacing:-1.5px;line-height:1.05;margin:15px 0}.hero p{font-size:17px;color:var(--muted);line-height:1.65}.checkin{margin-top:25px}.textarea{min-height:170px;resize:vertical}.row{display:flex;gap:12px;flex-wrap:wrap}.analyze{width:auto;margin-top:14px}.privacy{font-size:12px;color:var(--muted);margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:48px 0 18px}.section-head h2{margin:0;font-size:25px}.activities{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.activity{background:#fff;border:1px solid var(--line);border-radius:21px;padding:21px;box-shadow:0 8px 25px #20263b08;display:flex;flex-direction:column;min-height:210px}.activity .ico{font-size:25px}.activity h3{margin:12px 0 5px}.activity p{color:var(--muted);line-height:1.5;font-size:14px;margin:0 0 15px}.meta{font-size:12px;color:#7b7582;margin-bottom:15px}.activity button{margin-top:auto;background:var(--navy);color:white;padding:11px;border-radius:10px;font-weight:700}.mood-pill{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:999px;font-weight:750}.game{max-width:780px;margin:0 auto}.game-card{text-align:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:35px;box-shadow:var(--shadow)}.game-card h1{font-size:38px;margin:8px}.scoreline{display:flex;justify-content:center;gap:20px;color:var(--muted);margin:12px 0 25px}.game-area{min-height:270px;display:grid;place-items:center;background:var(--lav2);border-radius:20px;padding:20px}.game-controls{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}.game-controls button{padding:12px 18px;border-radius:11px;background:var(--navy);color:#fff;font-weight:700}.tiles{display:grid;grid-template-columns:repeat(4,72px);gap:10px}.tile{width:72px;height:72px;border-radius:14px;background:#d9d0e4;font-size:28px;font-weight:700}.target{width:70px;height:70px;border-radius:50%;background:var(--coral);position:absolute}.target-board{height:230px;width:100%;position:relative;overflow:hidden;background:#eee8f2;border-radius:18px}.tapbtn{width:130px;height:130px;border-radius:50%;background:var(--coral);color:#fff;font-size:20px;font-weight:800}.bigcolor{width:150px;height:150px;border-radius:25px;display:grid;place-items:center;font-weight:800}.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.choices button{padding:13px 20px;border-radius:12px;background:#fff;border:1px solid #d7d1ca}.word{font-size:30px;font-weight:800;letter-spacing:3px}.rps button{font-size:28px}.board{display:grid;grid-template-columns:repeat(3,82px);gap:8px}.cell{width:82px;height:82px;border:1px solid #d6d0ca;background:#fff;border-radius:12px;font-size:34px}.result{padding:22px;border-radius:18px;background:var(--lav2);margin-top:18px}.result h2{margin:0 0 10px}.progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}.empty{color:var(--muted);padding:25px;text-align:center}.safety{background:#fff1ed;border:1px solid #f1c2b9;padding:20px;border-radius:18px;color:#6d3029;line-height:1.6}.loading{padding:20px;text-align:center;color:var(--muted)}
@media(max-width:850px){.auth{grid-template-columns:1fr}.brand-panel{padding:45px 8vw}.brand-panel h1{font-size:48px}.hero{grid-template-columns:1fr}.activities{grid-template-columns:1fr 1fr}.progress-grid{grid-template-columns:1fr}}
@media(max-width:560px){.auth-panel{padding:20px}.auth-card{padding:25px}.activities{grid-template-columns:1fr}.appbar{padding:0 15px}.nav button{display:none}.page{padding:30px 16px}.tiles{grid-template-columns:repeat(4,55px)}.tile{width:55px;height:55px}.board{grid-template-columns:repeat(3,65px)}.cell{width:65px;height:65px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = " https://backend-ua3z.onrender.com";
let user=null, currentActivities=[], currentMood="neutral", gameTimer=null, gameStartedAt=0, gameState={};

const moodEmoji={angry:"😤",sad:"😔",stressed:"😵‍💫",confused:"🤔",lonely:"🫶",bored:"🥱",tired:"😴",anxious:"😟",happy:"😊",neutral:"🙂"};
const icons={memory:"🧩",reaction_rush:"⚡",target_blitz:"🎯",brain_tap:"🫳",odd_one_out:"🔎",color_clash:"🎨",number_recall:"🔢",math_sprint:"➕",word_scramble:"🔤",pattern_rush:"🧠",rps:"✊",tic_tac_toe:"⭕"};

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function api(path, options={}) {
  try{
    const res=await fetch(API+path,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options});
    const data=await res.json().catch(()=>({detail:"Server returned an invalid response."}));
    if(!res.ok) throw new Error(data.detail||"Something went wrong.");
    return data;
  }catch(e){
    if(e instanceof TypeError) throw new Error("OFFLINE");
    throw e;
  }
}
function offlineMessage(){return "Small Steps couldn't connect to the server. Please make sure the Python backend is running."}
function showAuth(tab="login"){
 document.getElementById("app").innerHTML=`<div class="auth"><section class="brand-panel"><div class="brand-mark"><span class="mark">✦</span> Small Steps</div><h1>One small step can change how you feel.</h1><p>A focused wellness space for students to check in, find a gentle activity, and make a little progress—one step at a time.</p><div class="mini-note">Your account and activity history are stored by the Small Steps Python backend. This prototype is for wellness and self-reflection, not medical diagnosis or emergency care.</div></section><section class="auth-panel"><div class="auth-card"><div class="tabs"><button id="tabLogin" class="${tab==="login"?"active":""}" onclick="showAuth('login')">Log in</button><button id="tabRegister" class="${tab==="register"?"active":""}" onclick="showAuth('register')">Create account</button></div>${tab==="login"?loginForm():registerForm()}</div></section></div>`;
}
function loginForm(){return `<h2>Welcome back</h2><p class="sub">Take another small step.</p><div id="authError"></div><form onsubmit="login(event)"><div class="field"><label>Email address</label><input id="loginEmail" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="primary">Log in</button></form><p class="tiny" style="margin-top:18px">New here? Choose “Create account” above.</p>`}
function registerForm(){return `<h2>Create your account</h2><p class="sub">A private space for your Small Steps journey.</p><div id="authError"></div><form onsubmit="register(event)"><div class="field"><label>Full name</label><input id="regName" required minlength="2" autocomplete="name"></div><div class="field"><label>Email address</label><input id="regEmail" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="regPassword" type="password" minlength="6" required autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input id="regConfirm" type="password" minlength="6" required autocomplete="new-password"></div><div class="field"><label>Student / user type <span class="tiny">(optional)</span></label><select id="regType"><option value="">Prefer not to say</option><option>Student</option><option>College student</option><option>School student</option><option>Other</option></select></div><button class="primary">Create account</button></form>`}
function authError(msg){document.getElementById("authError").innerHTML=`<div class="error">${escapeHtml(msg==="OFFLINE"?offlineMessage():msg)}</div>`}
async function register(e){e.preventDefault();const data={full_name:regName.value,email:regEmail.value,password:regPassword.value,confirm_password:regConfirm.value,user_type:regType.value||null};try{const r=await api("/api/register",{method:"POST",body:JSON.stringify(data)});user=r.user;showApp("home")}catch(x){authError(x.message)}}
async function login(e){e.preventDefault();try{const r=await api("/api/login",{method:"POST",body:JSON.stringify({email:loginEmail.value,password:loginPassword.value})});user=r.user;showApp("home")}catch(x){authError(x.message)}}
function showApp(view="home"){
 document.getElementById("app").innerHTML=`<header class="appbar"><div class="brand-mark"><span class="mark" style="width:34px;height:34px;border-radius:11px">✦</span> Small Steps</div><nav class="nav"><button id="navHome" onclick="renderHome()">Home</button><button id="navProgress" onclick="renderProgress()">My Progress</button><button onclick="logout()">Log out</button></nav><div class="user-chip">Hi, ${escapeHtml(user.full_name.split(" ")[0])}</div></header><main id="main"></main>`;
 view==="progress"?renderProgress():renderHome();
}
function setNav(active){["Home","Progress"].forEach(x=>{const el=document.getElementById("nav"+x);if(el)el.classList.toggle("active",active===x)})}
function renderHome(){setNav("Home");document.getElementById("main").innerHTML=`<div class="page"><section class="hero"><div class="hero-card"><div class="eyebrow">Your check-in</div><h1>How are you feeling today?</h1><p>There is no right answer. Tell Small Steps what is on your mind, and it will suggest a few simple activities based on your words.</p><div class="checkin"><div class="field"><label>What's going on?</label><textarea id="moodText" class="textarea" placeholder="For example: I’m feeling extremely angry and frustrated because of something that happened today."></textarea></div><button class="primary analyze" onclick="analyzeMood()">Analyze My Mood</button><div class="privacy">Small Steps uses a transparent prototype keyword/context classifier. It is not a clinical AI model.</div></div></div><div class="soft-card"><div class="eyebrow">A gentle reminder</div><h2 style="font-size:28px">You don't have to fix everything today.</h2><p style="color:var(--muted);line-height:1.7">Choose one tiny activity. A minute of focus, play, or breathing can be enough for a small reset.</p><div style="font-size:58px;margin-top:35px">🌿</div><p class="tiny">Wellness and self-reflection tool — not a medical diagnosis or emergency service.</p></div></section><section id="recommendationArea"></section></div>`}
async function analyzeMood(){
 const msg=document.getElementById("moodText").value.trim();
 if(!msg){document.getElementById("moodText").focus();alert("Tell us a little about how you're feeling first.");return}
 const area=document.getElementById("recommendationArea");area.innerHTML='<div class="loading">Taking a small moment to understand your check-in…</div>';
 try{
  const r=await api("/api/analyze",{method:"POST",body:JSON.stringify({user_id:user.id,mood:"",message:msg,count:6})});
  if(r.safety_alert){area.innerHTML=`<div class="section-head"><div><div class="eyebrow">Your check-in</div><h2>We hear you.</h2></div></div><div class="safety"><strong>If you may be in immediate danger or might hurt yourself, please pause the activities.</strong><br>Contact a trusted person who can stay with you and use your local emergency/crisis service or go to the nearest emergency department. Small Steps is not an emergency service. If you are safe right now, you can return to activities when you're ready.</div>`;return}
  currentMood=r.mood;currentActivities=r.activities;
  await api("/api/mood",{method:"POST",body:JSON.stringify({user_id:user.id,mood:r.mood,message:msg})});
  renderRecommendations(r.mood,r.activities);
 }catch(e){area.innerHTML=`<div class="error">${escapeHtml(e.message==="OFFLINE"?offlineMessage():e.message)}</div>`}
}
function renderRecommendations(mood,acts){
 const area=document.getElementById("recommendationArea");
 area.innerHTML=`<div class="section-head"><div><div class="eyebrow">Based on your check-in</div><h2>Detected mood: ${moodEmoji[mood]} ${mood[0].toUpperCase()+mood.slice(1)}</h2></div><span class="mood-pill">Prototype analysis</span></div><p style="color:var(--muted);margin-top:-8px">Here are a few Small Steps for you.</p><div class="activities">${acts.map(a=>`<article class="activity"><div class="ico">${icons[a.game_key]||"✦"}</div><h3>${escapeHtml(a.name)}</h3><div class="meta">${escapeHtml(a.category)} • ${escapeHtml(a.duration)}</div><p>${escapeHtml(a.description)}</p><button onclick="openGame(${a.id})">PLAY</button></article>`).join("")}</div>`;
}
async function openGame(id){
 const a=currentActivities.find(x=>x.id===id);if(!a)return;
 document.getElementById("main").innerHTML=`<div class="page"><div class="game"><div class="game-card"><div class="eyebrow">${escapeHtml(a.category)}</div><h1>${escapeHtml(a.name.replace(/ • Round \\d+$/,""))}</h1><p style="color:var(--muted)">${escapeHtml(a.description)}</p><div class="scoreline"><span>Score: <b id="gameScore">0</b></span><span>Time: <b id="gameTime">0</b>s</span></div><div id="gameArea" class="game-area"></div><div id="gameControls" class="game-controls"></div></div></div></div>`;
 gameState={activity:a,score:0,done:false};clearInterval(gameTimer);gameTimer=null;gameStartedAt=Date.now();renderGame(a.game_key);
}
function startClock(){if(gameTimer)return;gameStartedAt=Date.now();gameTimer=setInterval(()=>{document.getElementById("gameTime").textContent=Math.floor((Date.now()-gameStartedAt)/1000)},250)}
function finishGame(score){if(gameState.done)return;gameState.done=true;clearInterval(gameTimer);gameTimer=null;const duration=Math.max(1,Math.floor((Date.now()-gameStartedAt)/1000));document.getElementById("gameScore").textContent=score;document.getElementById("gameArea").innerHTML=`<div class="result"><h2>Nice work! ✦</h2><p>Score: <b>${score}</b></p><p>Time: <b>${duration} seconds</b></p></div>`;document.getElementById("gameControls").innerHTML=`<button onclick="openGame(${gameState.activity.id})">Play Another</button><button onclick="backActivities()">Back to Activities</button>`;api("/api/game",{method:"POST",body:JSON.stringify({user_id:user.id,activity_id:gameState.activity.id,game_name:gameState.activity.name,score,duration})}).catch(()=>{})}
function backActivities(){renderHome();setTimeout(()=>renderRecommendations(currentMood,currentActivities),0)}
function renderGame(key){
 const area=document.getElementById("gameArea"), controls=document.getElementById("gameControls");
 if(key==="memory"){memoryGame(area,controls);return}
 if(key==="reaction_rush"){reactionGame(area,controls);return}
 if(key==="target_blitz"){targetGame(area,controls);return}
 if(key==="brain_tap"){tapGame(area,controls);return}
 if(key==="odd_one_out"){oddGame(area,controls);return}
 if(key==="color_clash"){colorGame(area,controls);return}
 if(key==="number_recall"){numberGame(area,controls);return}
 if(key==="math_sprint"){mathGame(area,controls);return}
 if(key==="word_scramble"){wordGame(area,controls);return}
 if(key==="pattern_rush"){patternGame(area,controls);return}
 if(key==="rps"){rpsGame(area,controls);return}
 if(key==="tic_tac_toe"){tttGame(area,controls);return}
}
function startButton(controls,fn,label="Start"){controls.innerHTML=`<button onclick="${fn}">${label}</button>`}
function memoryGame(area,controls){
 area.innerHTML=`<div><p>Find all 8 matching pairs.</p><div id="tiles" class="tiles"></div></div>`;const vals=["🌱","🌱","⭐","⭐","☁️","☁️","🌙","🌙","🍀","🍀","🦋","🦋","☀️","☀️","🌸","🌸"].sort(()=>Math.random()-.5);let open=[],matched=0;const board=document.getElementById("tiles");vals.forEach((v,i)=>{const b=document.createElement("button");b.className="tile";b.textContent="";b.onclick=()=>{if(gameState.done||open.length>=2||b.dataset.done)return;startClock();b.textContent=v;open.push([b,v]);if(open.length===2){if(open[0][1]===open[1][1]){open.forEach(x=>x[0].dataset.done="1");open=[];matched++;gameState.score=matched*10;document.getElementById("gameScore").textContent=gameState.score;if(matched===8)finishGame(gameState.score)}else setTimeout(()=>{open.forEach(x=>x[0].textContent="");open=[]},500)}};board.appendChild(b)});controls.innerHTML=`<button onclick="openGame(${gameState.activity.id})">Restart</button>`}
function reactionGame(area,controls){
 area.innerHTML=`<div id="reactionMsg">Press Start, then wait for the signal.</div>`;startButton(controls,"beginReaction()");}
function beginReaction(){const area=document.getElementById("gameArea"),controls=document.getElementById("gameControls");let waiting=true;area.innerHTML=`<button id="reactBtn" class="tapbtn" style="background:#c9c1cf">WAIT</button>`;controls.innerHTML="";const delay=1200+Math.random()*2600;setTimeout(()=>{if(gameState.done)return;waiting=false;const t=performance.now();const b=document.getElementById("reactBtn");b.style.background="var(--coral)";b.textContent="TAP!";b.onclick=()=>{const ms=Math.round(performance.now()-t);finishGame(Math.max(20,Math.min(100,100-Math.floor(ms/10))))}},delay);document.getElementById("reactBtn").onclick=()=>{if(waiting){gameState.score=0;document.getElementById("reactionMsg").textContent="Too early. Restart and wait for TAP!";controls.innerHTML=`<button onclick="openGame(${gameState.activity.id})">Restart</button>`}}}
function targetGame(area,controls){area.innerHTML=`<div class="target-board" id="targetBoard"></div>`;controls.innerHTML=`<button onclick="beginTarget()">Start</button>`}
function beginTarget(){startClock();let hits=0;const board=document.getElementById("targetBoard");board.innerHTML="";function spawn(){if(hits>=10){finishGame(hits*10);return}const t=document.createElement("button");t.className="target";t.style.left=Math.random()*80+"%";t.style.top=Math.random()*70+"%";t.onclick=()=>{hits++;document.getElementById("gameScore").textContent=hits*10;t.remove();spawn()};board.appendChild(t)}spawn();setTimeout(()=>{if(!gameState.done)finishGame(hits*10)},30000)}
function tapGame(area,controls){area.innerHTML=`<button class="tapbtn" id="tapBtn">TAP</button>`;controls.innerHTML=`<button onclick="beginTap()">Start 20 sec</button>`}
function beginTap(){startClock();let n=0;const b=document.getElementById("tapBtn");b.onclick=()=>{if(gameState.done)return;n++;document.getElementById("gameScore").textContent=n};setTimeout(()=>finishGame(n),20000)}
function oddGame(area,controls){const colors=["#e99a87","#9fb7a4","#8f82a8","#e6b85c"];const target=Math.floor(Math.random()*4);area.innerHTML=`<p>Find the odd tile.</p><div class="choices">${colors.map((c,i)=>`<button style="width:75px;height:75px;background:${c}" onclick="chooseOdd(${i},${target})"></button>`).join("")}</div>`;startClock();controls.innerHTML=""}
function chooseOdd(i,t){finishGame(i===t?100:0)}
function colorGame(area,controls){const colors=["Coral","Sage","Lavender","Navy"];const target=colors[Math.floor(Math.random()*colors.length)];const css={Coral:"#e99a87",Sage:"#9fb7a4",Lavender:"#8f82a8",Navy:"#20263b"};area.innerHTML=`<div><p>Match the target: <b>${target}</b></p><div class="choices">${colors.map(c=>`<button class="bigcolor" style="background:${css[c]};color:${c==="Navy"?"#fff":"#20263b"}" onclick="finishGame('${c}'==='${target}'?100:0)">${c}</button>`).join("")}</div></div>`;startClock();controls.innerHTML=""}
function numberGame(area,controls){const n=String(Math.floor(1000+Math.random()*9000));area.innerHTML=`<div><p>Remember this number:</p><div class="word">${n}</div><input id="numInput" class="field" style="padding:12px;margin-top:15px" placeholder="Type it here"></div>`;startClock();controls.innerHTML=`<button onclick="finishGame(document.getElementById('numInput').value=== '${n}'?100:20)">Check</button>`}
function mathGame(area,controls){const a=Math.floor(Math.random()*20)+1,b=Math.floor(Math.random()*20)+1;area.innerHTML=`<div><p>What is <b>${a} + ${b}</b>?</p><input id="mathInput" type="number" style="padding:14px;border:1px solid #ddd;border-radius:12px"></div>`;startClock();controls.innerHTML=`<button onclick="finishGame(Number(document.getElementById('mathInput').value)===${a+b}?100:0)">Check</button>`}
function wordGame(area,controls){const words=["SMILE","CALM","KIND","BRAVE","FOCUS","LIGHT"];const w=words[Math.floor(Math.random()*words.length)];const scr=w.split("").sort(()=>Math.random()-.5).join("");area.innerHTML=`<div><p>Unscramble:</p><div class="word">${scr}</div><input id="wordInput" style="padding:14px;border:1px solid #ddd;border-radius:12px;text-transform:uppercase" placeholder="Your answer"></div>`;startClock();controls.innerHTML=`<button onclick="finishGame(document.getElementById('wordInput').value.toUpperCase()=== '${w}'?100:0)">Check</button>`}
function patternGame(area,controls){const seq=Array.from({length:4},()=>Math.floor(Math.random()*4));area.innerHTML=`<div><p>Remember this pattern.</p><div id="pat" class="choices">${seq.map(x=>`<span style="width:55px;height:55px;border-radius:12px;background:${["#e99a87","#9fb7a4","#8f82a8","#20263b"][x]}"></span>`).join("")}</div><div id="patInputs" class="choices" style="margin-top:15px">${[0,1,2,3].map(i=>`<button onclick="patternPick(${i})">${i+1}</button>`).join("")}</div></div>`;gameState.pattern=seq;gameState.picks=[];startClock();setTimeout(()=>document.getElementById("pat").innerHTML="<p>Now enter the pattern.</p>",1200)}
function patternPick(x){gameState.picks.push(x);if(gameState.picks.length===gameState.pattern.length)finishGame(gameState.picks.every((v,i)=>v===gameState.pattern[i])?100:20)}
function rpsGame(area,controls){area.innerHTML=`<div><p>Best of five. Choose your move.</p><div class="choices rps">${["✊","✋","✌️"].map((x,i)=>`<button onclick="rpsPick(${i})">${x}</button>`).join("")}</div><p id="rpsStatus"></p></div>`;gameState.rps=[0,0];gameState.round=0;startClock();controls.innerHTML=""}
function rpsPick(p){if(gameState.round>=5)return;const c=Math.floor(Math.random()*3);let r=p===c?0:((p-c+3)%3===1?1:-1);if(r>0)gameState.rps[0]++;else if(r<0)gameState.rps[1]++;gameState.round++;document.getElementById("rpsStatus").textContent=`You ${gameState.rps[0]} — Computer ${gameState.rps[1]}`;if(gameState.round===5)finishGame(gameState.rps[0]*20)}
function tttGame(area,controls){area.innerHTML=`<div><p id="tttStatus">Your turn — X</p><div id="board" class="board"></div></div>`;gameState.ttt=Array(9).fill("");gameState.turn="X";startClock();const b=document.getElementById("board");for(let i=0;i<9;i++){const c=document.createElement("button");c.className="cell";c.onclick=()=>tttMove(i,c);b.appendChild(c)}controls.innerHTML=`<button onclick="openGame(${gameState.activity.id})">Restart</button>`}
function tttMove(i,c){if(gameState.ttt[i]||gameState.done)return;gameState.ttt[i]="X";c.textContent="X";if(checkWinner(gameState.ttt,"X")){finishGame(100);return}if(gameState.ttt.every(Boolean)){finishGame(50);return}const empties=gameState.ttt.map((v,i)=>v?null:i).filter(v=>v!==null);const ai=empties[Math.floor(Math.random()*empties.length)];gameState.ttt[ai]="O";document.querySelectorAll(".cell")[ai].textContent="O";if(checkWinner(gameState.ttt,"O")){finishGame(20);return}if(gameState.ttt.every(Boolean))finishGame(50)}
function checkWinner(b,p){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(x=>x.every(i=>b[i]===p))}
async function renderProgress(){setNav("Progress");const main=document.getElementById("main");main.innerHTML=`<div class="page"><div class="section-head"><div><div class="eyebrow">Your journey</div><h1 style="margin:7px 0 0">My Progress</h1></div><button class="secondary" onclick="renderProgress()">Refresh</button></div><div id="progress" class="loading">Loading your recent progress…</div></div>`;try{const r=await api("/api/mood/"+user.id);document.getElementById("progress").className="progress-grid";document.getElementById("progress").innerHTML=`<div class="soft-card"><h2>Recent mood check-ins</h2>${r.moods.length?`<table class="table"><tr><th>Mood</th><th>Date</th></tr>${r.moods.map(x=>`<tr><td>${moodEmoji[x.mood]||"🙂"} ${escapeHtml(x.mood)}</td><td>${new Date(x.created_at.replace(" ","T")+"Z").toLocaleString()}</td></tr>`).join("")}</table>`:`<div class="empty">Your check-ins will appear here.</div>`}</div><div class="soft-card"><h2>Recent activities</h2>${r.games.length?`<table class="table"><tr><th>Activity</th><th>Score</th><th>Date</th></tr>${r.games.map(x=>`<tr><td>${escapeHtml(x.game_name.replace(/ • Round \\d+$/,""))}</td><td><b>${x.score}</b></td><td>${new Date(x.created_at.replace(" ","T")+"Z").toLocaleString()}</td></tr>`).join("")}</table>`:`<div class="empty">Play an activity and your results will appear here.</div>`}</div>`}catch(e){document.getElementById("progress").innerHTML=`<div class="error">${escapeHtml(e.message==="OFFLINE"?offlineMessage():e.message)}</div>`}}
function logout(){user=null;currentActivities=[];clearInterval(gameTimer);showAuth("login")}
showAuth("login");
</script>
</body>
</html>

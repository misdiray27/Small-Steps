<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');
:root{--g:#123b34;--g2:#2f6b5b;--m:#e5f1eb;--bg:#fbfaf6;--mut:#71817c;--ln:#dfeae5;--gold:#d7a64b;--red:#934b44}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--g);font-family:"DM Sans",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}

.logo img{height:48px;width:auto;display:block}.nav .logo{margin-right:auto}.nav button{border:0;background:transparent;color:var(--mut);font-weight:700;padding:9px 11px;border-radius:11px}.nav button:hover,.nav button.on{background:var(--m);color:var(--g)}
.wrap{width:90%;max-width:1160px;margin:0 auto}.view{display:block;padding:42px 0;min-height:calc(100vh - 72px)}.hero{min-height:600px;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}.ey{display:inline-block;background:var(--m);padding:8px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:1px}.hero h1{font:800 57px/1.04 Manrope;margin:16px 0}.hero h1 span{color:var(--g2)}.hero p,.mut{color:var(--mut);line-height:1.7}.orb{width:310px;height:310px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:95px;background:radial-gradient(circle,#f5e6c5,#d8ece4);box-shadow:0 30px 80px #123b3420}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:800}.primary{background:var(--g);color:#fff}.soft{background:#fff;color:var(--g);border:1px solid var(--ln)}.danger{background:#fff0ee;color:var(--red);border:1px solid #edd0cc}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.head{margin-bottom:24px}.head h2{font:800 40px Manrope;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid var(--ln);border-radius:21px;padding:21px;box-shadow:0 20px 60px #123b3410}.card h3{margin:9px 0}.card p{color:var(--mut);line-height:1.6}.tag{display:inline-block;font-size:11px;font-weight:800;padding:6px 9px;background:var(--m);border-radius:20px}.field{margin:13px 0}.field label{font-size:13px;font-weight:800;display:block;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--ln);border-radius:12px;padding:12px;background:#fff;color:var(--g)}.field textarea{min-height:130px;resize:vertical}.error{background:#fff0ee;color:var(--red);padding:10px;border-radius:12px;margin:10px 0}.success{background:#e9f6ef;color:#245b4c;padding:10px;border-radius:12px;margin:10px 0}.small{font-size:12px;color:var(--mut)}
.chatbox{max-width:900px;margin:auto}.msgs{height:470px;overflow:auto;background:#f2f7f4;border:1px solid var(--ln);border-radius:22px;padding:18px}.msg{max-width:78%;padding:12px 15px;border-radius:17px;margin:9px 0;white-space:pre-wrap;line-height:1.6}.msg.u{margin-left:auto;background:var(--g);color:#fff}.msg.m{background:#fff;border:1px solid var(--ln)}.msg-actions{display:flex;gap:6px;margin-top:7px}.chatbar{display:flex;gap:8px;margin-top:10px}.chatbar input{flex:1;border:1px solid var(--ln);border-radius:14px;padding:13px}.micbtn{min-width:52px;border:1px solid var(--ln);background:#fff;color:var(--g);border-radius:14px;font-size:18px;font-weight:800}.micbtn.listening{background:#e9f6ef;border-color:#78aa99}.voicehint{font-size:11px;color:var(--mut);margin-top:6px}
.music{background:linear-gradient(135deg,#153f36,#2f6b5b);color:#fff;border-radius:24px;padding:26px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.music p{color:#dbe9e4}.timer{font:800 45px Manrope;margin:10px 0}.sessions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.session{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:18px}.audio-status{font-size:12px;color:#dbe9e4;margin-top:10px}.audio-fallback{background:#fff8e7;color:#76551d;border-radius:12px;padding:9px;margin-top:9px;font-size:12px}
.profile{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stats strong{font:800 29px Manrope;display:block}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand{padding:9%;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#e5f1eb,#fbfaf6)}.brand h1{font:800 53px Manrope}.authbox{display:flex;align-items:center;justify-content:center;padding:25px}.authcard{width:min(560px,100%);background:#fff;border:1px solid var(--ln);border-radius:25px;padding:28px;box-shadow:0 20px 70px #123b3410}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid var(--ln);background:#fff;padding:12px;border-radius:13px;text-align:left}.choice.sel{background:var(--m);border-color:#78aa99}.steps{display:flex;gap:5px;margin-bottom:20px}.steps i{height:5px;flex:1;background:#e6efeb;border-radius:9px}.steps i.on{background:var(--g)}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.avatar{height:55px;border:1px solid var(--ln);border-radius:15px;background:#fff;font-size:25px}.avatar.sel{background:var(--m);border-color:#78aa99;box-shadow:inset 0 0 0 2px var(--g)}
.single-recommend{display:flex;gap:18px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:22px;padding:20px;box-shadow:0 16px 50px #123b340d}.single-rec-icon{width:62px;height:62px;border-radius:18px;background:var(--m);display:grid;place-items:center;font-size:30px;flex:0 0 auto}
.game-tools{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.game-tools input{flex:1;min-width:260px;border:1px solid var(--ln);border-radius:14px;padding:13px 15px;background:#fff}.game-filters{display:flex;gap:7px;flex-wrap:wrap}.filter-chip{border:1px solid var(--ln);background:#fff;color:var(--mut);padding:9px 12px;border-radius:999px;font-weight:800;font-size:11px}.filter-chip.on{background:var(--g);color:#fff}.mega-game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.mega-game-card{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:18px;min-height:235px;display:flex;flex-direction:column;box-shadow:0 14px 45px #123b3409}.mega-game-card:hover{transform:translateY(-3px);box-shadow:0 24px 70px #123b3418}.mega-icon{font-size:34px}.mega-top{display:flex;gap:6px;margin-top:10px}.duo-tag{font-size:10px;font-weight:900;padding:6px 8px;border-radius:999px;background:#f6ead0;color:#76551d}.mega-game-card h3{font-size:17px;margin:10px 0 6px}.mega-game-card p{font-size:13px;color:var(--mut);line-height:1.5;margin:0 0 12px}.mega-actions{display:flex;gap:7px;margin-top:auto}.mega-actions .btn{flex:1}.mega-arena{background:#f2f7f4;border:1px solid var(--ln);border-radius:24px;padding:22px;min-height:470px}.mega-scorebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--ln);padding:12px 15px;border-radius:14px;font-weight:800;margin-bottom:20px}.mega-play{min-height:300px}.instruction{text-align:center;color:var(--mut);margin-bottom:20px}.mega-target{position:absolute;left:40%;top:70px;width:85px;height:85px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:28px;font-weight:900}.mega-react{display:block;margin:60px auto;width:min(520px,90%);height:180px;border:0;border-radius:24px;background:#193d35;color:#fff;font:800 36px Manrope}.mega-seq{height:90px;display:grid;place-items:center;font:800 35px Manrope;letter-spacing:5px;background:#fff;border-radius:18px;margin-bottom:15px}.mega-input{display:block;width:min(360px,100%);margin:12px auto;padding:14px;border:1px solid var(--ln);border-radius:13px;text-align:center;font-size:18px;background:#fff}.math-q{text-align:center;font:800 38px Manrope;padding:35px 10px;background:#fff;border-radius:20px;margin-bottom:15px}.focus-wall{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:600px;margin:20px auto}.focus-cell{height:58px;border:1px solid var(--ln);border-radius:12px;background:#fff;font-size:24px;color:var(--g)}.color-word{text-align:center;font:800 54px Manrope;padding:35px 10px;background:#fff;border-radius:20px}.mega-result{text-align:center;min-height:28px}.calm-circle{width:170px;height:170px;border-radius:50%;margin:45px auto 25px;background:var(--m);display:grid;place-items:center;font:800 55px Manrope;box-shadow:0 0 0 18px #eaf4ef,0 0 0 36px #f3f8f5}
.backbar{display:flex;gap:8px;margin:0 auto 10px;width:90%;max-width:1160px}.backbtn{border:1px solid var(--ln);background:#fff;color:var(--g);padding:9px 12px;border-radius:11px;font-weight:800}
.overlay{position:fixed;inset:0;background:#123b3475;backdrop-filter:blur(7px);display:grid;place-items:center;z-index:100;padding:20px}.tour{width:min(720px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 30px 100px #0003;animation:pop .35s ease}.tour-art{height:210px;border-radius:22px;background:linear-gradient(135deg,#e5f1eb,#f6ead0);display:grid;place-items:center;font-size:82px;animation:breathe 2.5s ease-in-out infinite}.tour h2{font:800 30px Manrope}.tour-dots{display:flex;gap:6px}.tour-dots i{width:8px;height:8px;border-radius:50%;background:#dfeae5}.tour-dots i.on{background:var(--g)}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}@keyframes breathe{50%{transform:scale(1.04)}}
@media(max-width:1000px){.mega-game-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.hero,.auth,.profile{grid-template-columns:1fr}.grid,.sessions{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.hero h1{font-size:42px}.orb{width:230px;height:230px;font-size:70px}.nav{position:relative}}@media(max-width:760px){.mega-game-grid{grid-template-columns:repeat(2,1fr)}.single-recommend{align-items:flex-start}.focus-wall{grid-template-columns:repeat(4,1fr)}}@media(max-width:550px){.grid,.sessions,.choicegrid{grid-template-columns:1fr}.music{grid-template-columns:1fr}.mega-game-grid{grid-template-columns:1fr}.avatar-grid{grid-template-columns:repeat(4,1fr)}.chatbar{flex-wrap:wrap}.chatbar input{min-width:100%}}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';

const API='https://backend-ua3z.onrender.com';
const SESSION_KEY='small_steps_session_v3';
const INTRO_KEY='small_steps_intro_seen_v3';
let user=null,currentView='home',viewHistory=[],tm=null,left=0,player=null,ambientCtx=null,ambientOsc=null;
let recognition=null,micListening=false,chatHistory=[],gameTimer=null,gameCleanup=null,activeGameMode='solo';

const S=[
['1-Minute Reset',60,'stress','🌱'],['2-Minute Breathing',120,'stress','🌬️'],['5-Minute Calm',300,'calm','🌙'],
['Before-Sleep Wind Down',420,'sleep','🌌'],['Exam Stress Reset',240,'focus','📚'],['Anger Cooldown',240,'anger','🍃'],
['Overthinking Reset',300,'overthinking','☁️'],['Loneliness Comfort',300,'lonely','🫶'],['Confidence Reset',180,'confidence','✨'],
['Morning Grounding',180,'morning','☀️'],['Afternoon Reboot',120,'afternoon','🌿'],['Body Scan',360,'body','🧘'],
['Focus Before Study',180,'focus','🎯'],['Post-College Decompress',300,'evening','🏡'],['Social Anxiety Reset',240,'anxiety','🫧'],
['Tired-Day Recovery',180,'tired','😴'],['Gratitude Pause',120,'positive','🌼'],['Self-Compassion Break',240,'sad','💛'],
['Mindful Walking Prep',120,'movement','🚶'],['Digital Detox Pause',180,'screen','📵'],['Pre-Presentation Calm',180,'performance','🎤'],
['Night Overthinking Ease',360,'sleep','🌙'],['Weekend Reset',300,'reset','🍵'],['Deep Relaxation',600,'deep','🪷']
];
const TRACKS={
 stress:['Stress Relief','audio/stress-relief.wav','🌿'],sleep:['Sleep & Night Calm','audio/sleep-calm.wav','🌙'],
 focus:['Study Focus','audio/focus.wav','🎧'],anger:['Anger Cooldown','audio/anger-cooldown.wav','🍃'],deep:['Deep Relaxation','audio/deep-relaxation.wav','🪷']
};
const AVATARS=['🌿','🌱','🌙','☀️','🪷','🫶','🧠','🎧','🍃','✨','🐼','🦊'];
const LANGS=['English','Hindi','Hinglish'];

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function qs(id){return document.getElementById(id);}
function showError(el,msg){if(el)el.innerHTML='<div class="error">'+esc(msg)+'</div>';}

async function api(path,options={},timeout=22000){
  const opts={...options,headers:{'Content-Type':'application/json',...(options.headers||{})}};
  let last;
  for(let attempt=0;attempt<2;attempt++){
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);
    try{
      const r=await fetch(API+path,{...opts,signal:ctl.signal});
      clearTimeout(timer);
      const d=await r.json().catch(()=>({detail:'Invalid server response'}));
      if(!r.ok){
        let msg=d.detail;
        if(Array.isArray(msg))msg=msg.map(x=>x.msg||x.message||String(x)).join(' ');
        if(msg&&typeof msg==='object')msg=msg.message||msg.msg||JSON.stringify(msg);
        throw new Error(msg||d.error||'Request failed');
      }
      return d;
    }catch(e){
      clearTimeout(timer);last=e;
      if(attempt===0)await new Promise(r=>setTimeout(r,700));
    }
  }
  if(last?.name==='AbortError')throw new Error('Backend is waking up or taking too long. Please try once more.');
  throw last||new Error('Unable to reach backend.');
}

function saveSession(){
  if(!user)return;
  localStorage.setItem(SESSION_KEY,JSON.stringify({
    user,language:user.language||window.appLanguage||'English',time_spend:window.smallStepsTime||'10 minutes',avatar:user.avatar||'🌿'
  }));
}
function loadSession(){
  try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}
}
function clearSession(){localStorage.removeItem(SESSION_KEY);}

function auth(step=0,state={}){
  document.getElementById('root').innerHTML='<div class="auth"><div class="brand"><div class="logo"><img src="assets/small-steps-logo.png" alt="Small Steps"></div><span class="ey">SMALL STEPS</span><h1>A calmer place to take your next small step.</h1><p class="mut">Talk, check in, meditate, listen, play, and find one useful thing that helps.</p></div><div class="authbox"><div class="authcard" id="ac"></div></div></div>';
  renderAuth(step,state);
}
let R={};
function renderAuth(step,state={}){
  R={...state};
  const c=qs('ac');let b='';
  if(step===0){
    const saved=loadSession();
    b='<h2>Welcome back</h2><p class="small">Log in to continue.</p><div id="er"></div>';
    if(saved?.user)b+='<div class="success"><b>Saved session found.</b><br>Continue as <b>'+esc(saved.user.full_name||'your account')+'</b> on this device.</div><button class="btn primary" onclick="restoreSaved()">Continue with saved account</button><div class="small" style="margin:10px 0">Or log in normally below.</div>';
    b+='<div class="field"><label>Email</label><input id="em" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div><button class="btn primary" onclick="login()">Log in</button><button class="btn soft" onclick="renderAuth(1,{})" style="margin-left:7px">Create account</button><br><button class="btn soft" onclick="renderAuth(99,{})" style="margin-top:12px">Forgot password?</button>';
  }else if(step===99){
    b='<h2>Forgot password</h2><p class="small">Enter your email. If the backend supports reset, it will respond here.</p><div id="er"></div><div class="field"><label>Email</label><input id="fe" type="email"></div><button class="btn primary" onclick="forgot()">Send reset link</button><button class="btn soft" onclick="renderAuth(0,{})" style="margin-left:7px">Back</button>';
  }else{
    const total=10;
    b='<div class="steps">'+Array.from({length:total},(_,i)=>'<i class="'+(i<step?'on':'')+'"></i>').join('')+'</div>';
    if(step===1)b+='<h2>Create your account</h2><p class="small">Step 1 of 10</p><div id="regerr"></div><div class="field"><label>Full name</label><input id="rn" value="'+esc(R.name||'')+'"></div><div class="field"><label>Email</label><input id="re" type="email" value="'+esc(R.email||'')+'"></div><div class="field"><label>Password</label><input id="rp" type="password" minlength="6"><div class="small">Minimum 6 characters.</div></div><div class="field"><label>Confirm password</label><input id="rc" type="password" minlength="6"></div><button class="btn primary" onclick="nextRegister(2)">Continue</button>';
    if(step===2)b+='<h2>Choose your language</h2><p class="small">Mio will use this preference when possible.</p><div class="choicegrid">'+LANGS.map(x=>'<button class="choice '+(R.language===x?'sel':'')+'" onclick="pickReg(\'language\',\''+x+'\',3)">'+(x==='English'?'🇬🇧':x==='Hindi'?'🇮🇳':'💬')+' '+x+'</button>').join('')+'</div>';
    if(step===3)b+='<h2>Pick your avatar</h2><p class="small">You can change this later from Profile.</p><div class="avatar-grid">'+AVATARS.map(x=>'<button class="avatar '+(R.avatar===x?'sel':'')+'" onclick="pickAvatar(\''+x+'\',4)">'+x+'</button>').join('')+'</div>';
    if(step===4)b+='<h2>What usually stresses you?</h2><p class="small">Select all that apply.</p><div class="choicegrid">'+['Money','Work','School / College','Health','Relationships','Family responsibilities','Social life','Future / Career'].map(x=>'<button class="choice '+(R.stress?.includes(x)?'sel':'')+'" onclick="toggleReg(this,\'stress\',\''+x+'\')">'+x+'</button>').join('')+'</div><div class="field"><label>Other cause <span class="small">(optional)</span></label><input id="os" value="'+esc(R.other||'')+'"></div><button class="btn primary" onclick="nextRegister(5)">Continue</button>';
    if(step===5)b+='<h2>When would you like to meditate?</h2><div class="choicegrid">'+['Morning','Afternoon','Night','Not sure yet'].map(x=>'<button class="choice '+(R.mt===x?'sel':'')+'" onclick="pickReg(\'mt\',\''+x+'\',6)">'+x+'</button>').join('')+'</div>';
    if(step===6)b+='<h2>How have you been feeling lately?</h2><div class="choicegrid">'+['Good','Stressed','Sad','Indifferent'].map(x=>'<button class="choice '+(R.rf===x?'sel':'')+'" onclick="pickReg(\'rf\',\''+x+'\',7)">'+x+'</button>').join('')+'</div>';
    if(step===7)b+='<h2>What is your meditation experience?</h2><div class="choicegrid">'+['Beginner','Experienced','None'].map(x=>'<button class="choice '+(R.me===x?'sel':'')+'" onclick="pickReg(\'me\',\''+x+'\',8)">'+x+'</button>').join('')+'</div>';
    if(step===8)b+='<h2>What should Small Steps help with?</h2><div class="choicegrid">'+['Managing stress','Better sleep','Staying focused','Overthinking','Healthy habits','Feeling less lonely','Study pressure','Just exploring'].map(x=>'<button class="choice '+(R.goals?.includes(x)?'sel':'')+'" onclick="toggleReg(this,\'goals\',\''+x+'\')">'+x+'</button>').join('')+'</div><button class="btn primary" onclick="nextRegister(9)">Continue</button>';
    if(step===9)b+='<h2>How much time do you want to spend?</h2><p class="mut">This keeps recommendations realistic.</p><div class="choicegrid">'+['5 minutes','10 minutes','15 minutes','20 minutes','30 minutes','45 minutes'].map(x=>'<button class="choice '+(R.time_spend===x?'sel':'')+'" onclick="pickReg(\'time_spend\',\''+x+'\',10)">⏱ '+x+'</button>').join('')+'</div>';
    if(step===10)b='<h2>You are ready 🌿</h2><p class="mut">Your preferences are saved with your account. Next, we will show you a short animated tour of the app.</p><button class="btn primary" onclick="finishRegister()">Create account</button>';
  }
  c.innerHTML=b;
}
function toggleReg(btn,key,val){R[key]=R[key]||[];R[key]=R[key].includes(val)?R[key].filter(x=>x!==val):[...R[key],val];btn.classList.toggle('sel');}
function pickReg(key,val,next){R[key]=val;renderAuth(next,R);}
function pickAvatar(val,next){R.avatar=val;renderAuth(next,R);}
function nextRegister(next){
  if(next===2){
    R.name=(qs('rn')?.value||'').trim();R.email=(qs('re')?.value||'').trim();R.pass=qs('rp')?.value||'';R.pass2=qs('rc')?.value||'';
    const e=qs('regerr');if(!R.name||!R.email){showError(e,'Please complete your name and email.');return}
    if(R.pass.length<6){showError(e,'Password must be at least 6 characters.');return}
    if(R.pass!==R.pass2){showError(e,'Passwords do not match.');return}
  }
  if(next===5)R.other=(qs('os')?.value||'').trim();
  renderAuth(next,R);
}
async function finishRegister(){
  try{
    const payload={full_name:R.name,email:R.email,password:R.pass,confirm_password:R.pass2,user_type:'General User',
      stress_sources:R.stress||[],other_stress:R.other||null,meditation_time:R.mt||'Not set',recent_feeling:R.rf||'Indifferent',
      meditation_experience:R.me||'None',goals:R.goals||[],support_preference:'A mixture of everything'};
    const d=await api('/api/register',{method:'POST',body:JSON.stringify(payload)});
    user=d.user||{full_name:R.name,email:R.email};
    user.language=R.language||'English';user.avatar=R.avatar||'🌿';user.time_spend=R.time_spend||'10 minutes';
    window.appLanguage=user.language;window.smallStepsTime=user.time_spend;saveSession();
    app();setTimeout(()=>showIntroTour(true),300);
  }catch(e){alert(e.message)}
}
async function login(){
  const email=(qs('em')?.value||'').trim(),password=qs('pw')?.value||'';
  if(!email||!password){showError(qs('er'),'Enter email and password.');return}
  try{
    const d=await api('/api/login',{method:'POST',body:JSON.stringify({email,password})});
    user=d.user||{email};user.language=user.language||'English';user.avatar=user.avatar||'🌿';
    window.appLanguage=user.language;window.smallStepsTime=user.time_spend||'10 minutes';saveSession();app();
  }catch(e){
    const saved=loadSession();
    if(saved?.user?.email?.toLowerCase()===email.toLowerCase()){

function getSpeechRecognition(){return window.SpeechRecognition||window.webkitSpeechRecognition}
function toggleMic(){

function localMio(text){
  const t=text.toLowerCase(),lang=window.appLanguage||'English';
  const hi=lang==='Hindi',hing=lang==='Hinglish';
  if(/suicide|kill myself|self harm|hurt myself|end my life|want to die|marna|khudkushi/.test(t))return hi?'Mujhe bahut afsos hai ki tum itna intense feel kar rahe ho. Abhi kisi trusted person ke paas raho aur immediate danger ho to local emergency/crisis support contact karo.':hing?'Bro, agar tumhe khud ko hurt karne ka thought aa raha hai, abhi akela mat rehna. Kisi trusted person ko batao aur immediate danger ho to emergency/crisis support contact karo.':'I am really sorry you are dealing with something this intense. Please stay with a trusted person and contact emergency/crisis support if you may be in immediate danger.';
  if(/exam|study|college|assignment/.test(t))return hi?'Pehle ek chhota step choose karo: 10 minute ke liye sirf ek task. Baaki baad mein.':hing?'Pehle sirf ek small task pick kar. 10 minutes usi par focus kar, phir decide karna next kya hai.':'Let us make this smaller: choose one task and give it 10 focused minutes. You do not need to solve the whole workload right now.';
  if(/angry|gussa|mad/.test(t))return hi?'Abhi reply dene se pehle 2 minute ka pause lo. Trigger ko ek line mein likho aur phir decide karo ki tumhe kya kehna hai.':hing?'Abhi immediately react mat kar. 2 minute pause, trigger ek line mein likh, phir response decide kar.':'Before reacting, take a two-minute pause. Write the trigger in one sentence, then decide what response you would respect later.';
  if(/sad|lonely|alone|udaas|akela/.test(t))return hi?'Tumhe abhi sab kuch fix karna zaroori nahi hai. Kisi ek safe person ko message karna bhi ek small step hai.':hing?'Sab kuch abhi fix karna zaroori nahi. Kisi ek trusted person ko simple “mujhe baat karni hai” text kar sakte ho.':'You do not have to fix everything right now. A small step could be messaging one trusted person and simply saying you need someone to talk to.';
  if(/tired|sleep|neend|thak/.test(t))return hi?'Aaj recovery ko priority do. Paani piyo, screen thodi der side rakho aur ek simple wind-down session try karo.':hing?'Aaj recovery priority bana. Paani, screen break, aur short wind-down session try kar.':'Make recovery the priority for tonight: water, a short screen break, and a low-stimulation wind-down.';
  return hi?'Main sun raha hoon. Jo hua usme sabse zyada difficult part kya tha?':hing?'I am listening. Jo hua usme sabse zyada difficult part kya laga?': 'I am listening. What part of what happened feels hardest right now?';
}
async function send(){
  const input = qs('ci');
  const box = qs('msgs');
  const t = (input?.value || '').trim();

  if(!t) return;

  // Show user's message
  box.insertAdjacentHTML(
    'beforeend',
    '<div class="msg u">' + esc(t) + '</div>'
  );

  input.value = '';
  box.scrollTop = box.scrollHeight;

  chatHistory.push({
    role:'user',
    content:t
  });

  // Temporary typing message
  const typingId = 'mioTyping' + Date.now();

  box.insertAdjacentHTML(
    'beforeend',
    '<div class="msg m" id="' + typingId + '">Mio is thinking...</div>'
  );

  box.scrollTop = box.scrollHeight;

  try{

    const language =
      window.appLanguage ||
      user?.language ||
      'English';

    const d = await api('/api/chat',{
      method:'POST',
      body:JSON.stringify({
        user_id:user.id,
        message:t,
        language:language
      })
    });

    // Remove typing message
    qs(typingId)?.remove();

    const reply =
      d.reply ||
      d.message ||
      localMio(t);

    chatHistory.push({
      role:'assistant',
      content:reply
    });

    addMioReply(reply);

    console.log('Mio AI response:',d);

  }catch(e){

    // Remove typing message
    qs(typingId)?.remove();

    console.error('Mio chat error:',e);

    // IMPORTANT:
    // Show actual error instead of silently pretending AI replied
    box.insertAdjacentHTML(
      'beforeend',
      '<div class="msg m">' +
      '<b>Mio is temporarily unavailable.</b><br>' +
      'Backend response nahi aa raha. Please try again in a moment.' +
      '</div>'
    );

    box.scrollTop = box.scrollHeight;
  }
}

function startSession(index){

function changeTrack(k){
  stopAudio(false);const item=TRACKS[k]||TRACKS.stress,src=resolveAudio(item[1]);
  player=new Audio();player.preload='auto';player.loop=true;player.volume=Number(qs('vol')?.value||.65);
  player.addEventListener('canplay',()=>{if(qs('audioStatus'))qs('audioStatus').textContent='Audio ready — press Play.'});
  player.addEventListener('error',()=>{if(qs('audioStatus'))qs('audioStatus').innerHTML='<div class="audio-fallback">Track file could not be loaded. Browser ambient fallback is available — press Play.</div>';});

async function toggleAudio(){
  if(!player)changeTrack(qs('track')?.value||'stress');
  if(!player)return;
  try{
    if(player.paused){await player.play();if(qs('playBtn'))qs('playBtn').textContent='❚❚ Pause';if(qs('audioStatus'))qs('audioStatus').textContent='Playing audio.';}
    else{player.pause();if(qs('playBtn'))qs('playBtn').textContent='▶ Play';}
  }catch(e){startAmbientFallback();if(qs('playBtn'))qs('playBtn').textContent='❚❚ Ambient';if(qs('audioStatus'))qs('audioStatus').innerHTML='<div class="audio-fallback">The audio file was blocked or missing, so a gentle browser-generated ambient sound is playing.</div>';}
}
function setVolume(v){if(player)player.volume=Number(v);if(gain)gain.gain.value=Number(v)*.06}
function startAmbientFallback(){
  try{
    if(ambientCtx)ambientCtx.close();ambientCtx=new (window.AudioContext||window.webkitAudioContext)();
    ambientOsc=ambientCtx.createOscillator();gain=ambientCtx.createGain();ambientOsc.type='sine';ambientOsc.frequency.value=220;gain.gain.value=.03;ambientOsc.connect(gain).connect(ambientCtx.destination);ambientOsc.start();
  }catch(e){toast('Browser audio could not start. Check the tab/device volume.')}
}
function stopAudio(reset=true){
  if(player){player.pause();player.currentTime=0;player=null}
  if(ambientCtx){try{ambientCtx.close()}catch{}ambientCtx=null;ambientOsc=null;gain=null}
  clearInterval(tm);tm=null;if(reset){left=0;if(qs('ti'))qs('ti').textContent='00:00';if(qs('playBtn'))qs('playBtn').textContent='▶ Play';if(qs('audioStatus'))qs('audioStatus').textContent='Stopped.'}
}

function games(preselect=''){
  qs('main').innerHTML='<section class="view"><div class="wrap"><div class="head"><span class="ey">MENTAL FITNESS LAB · 120 GAMES</span><h2>Pick a challenge that fits your mood.</h2><p class="mut">All games work solo. Games marked DUO support local pass-and-play.</p></div><div class="game-tools"><input id="gameSearch" placeholder="Search games..." oninput="renderGameCatalog()"><div id="gameFilters" class="game-filters"></div></div><div id="gameCatalog" class="mega-game-grid"></div></div></section>';
  const cats=['ALL',...new Set(GAME_CATALOG.map(g=>g.cat))];qs('gameFilters').innerHTML=cats.map(c=>'<button class="filter-chip '+(c==='ALL'?'on':'')+'" onclick="filterGames(\''+c+'\',this)">'+(c==='ALL'?'All games':c)+'</button>').join('');window.gameFilter='ALL';if(preselect)qs('gameSearch').value=preselect;renderGameCatalog();
}
function filterGames(c,b){window.gameFilter=c;document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderGameCatalog()}
function renderGameCatalog(){
  const q=(qs('gameSearch')?.value||'').toLowerCase();const list=GAME_CATALOG.filter(g=>(window.gameFilter==='ALL'||g.cat===window.gameFilter)&&(!q||(g.name+' '+g.family+' '+g.cat+' '+g.desc).toLowerCase().includes(q)));
  qs('gameCatalog').innerHTML=list.map(g=>'<article class="mega-game-card"><div class="mega-icon">'+g.icon+'</div><div class="mega-top"><span class="tag">'+g.cat+'</span>'+(g.duo?'<span class="duo-tag">DUO</span>':'')+'</div><h3>'+esc(g.name)+'</h3><p>'+esc(g.desc)+'</p><div class="mega-actions"><button class="btn primary" onclick="playMegaGame('+g.id+')">Play</button>'+(g.duo?'<button class="btn soft" onclick="playMegaGame('+g.id+',true)">2P</button>':'')+'</div></article>').join('');
}
function playMegaGame(id,duo=false){
  const g=GAME_CATALOG.find(x=>x.id===id)||GAME_CATALOG[0];activeGameMode=duo?'duo':'solo';gameShell(g.icon+' '+g.name,g);launchEngine(g);
}
function gameShell(title,g){
  qs('main').innerHTML='<section class="view"><div class="wrap"><div class="head"><span class="ey">MENTAL FITNESS LAB</span><h2>'+esc(title)+'</h2><p class="mut">'+esc(g.desc)+'</p></div><div class="mega-arena" id="megaArena"></div><div class="actions" style="justify-content:center"><button class="btn soft" onclick="games()">← Back to games</button></div></div></section>';
}
function launchEngine(g){
  const a=qs('megaArena');a.innerHTML='<div class="mega-scorebar"><span>Score: <b id="megaScore">0</b></span><span>Time: <b id="megaTime">60</b></span><span id="megaTurn">'+(activeGameMode==='duo'?'Player 1':'Solo')+'</span></div><div id="megaPlay" class="mega-play"></div><h3 id="megaResult" class="mega-result"></h3><button class="btn primary" id="megaStart">Start game</button>';
  qs('megaStart').onclick=()=>runEngine(g);
}
function runEngine(g){
  resetGameRuntime();const area=qs('megaPlay'),result=qs('megaResult'),start=qs('megaStart'),scoreEl=()=>qs('megaScore'),timeEl=()=>qs('megaTime'),turnEl=()=>qs('megaTurn');
  let score=0,time=60,round=0,turn=1,ended=false;start.disabled=true;
  const add=n=>{score=Math.max(0,score+n);scoreEl().textContent=score};const nextTurn=()=>{if(activeGameMode==='duo'){turn=turn===1?2:1;turnEl().textContent='Player '+turn}};
  const finish=msg=>{if(ended)return;ended=true;resetGameRuntime();result.textContent=msg;start.disabled=false;start.textContent='Play again'};
  gameTimer=setInterval(()=>{time--;timeEl().textContent=time;if(time<=0)finish((activeGameMode==='duo'?'Game over — ':'Time up — ')+score+' points')},1000);
  const engine=g.engine;
  if(engine==='tap')runTap(area,add,nextTurn);else if(engine==='react')runReact(area,add,nextTurn);else if(engine==='memory')runMemory(area,add,nextTurn);else if(engine==='focus')runFocus(area,add);else if(engine==='math')runMath(area,add,nextTurn);else if(engine==='word')runWord(area,add,nextTurn);else if(engine==='pattern')runPattern(area,add,nextTurn);else if(engine==='color')runColor(area,add);else if(engine==='number')runNumber(area,add,nextTurn);else runCalm(area,add);
}
function runTap(area,add,nextTurn){area.innerHTML='<div class="instruction">Tap the moving target as quickly as possible.</div><div style="height:320px;position:relative" id="tapZone"><button class="mega-target" id="megaTarget">●</button></div>';const b=qs('megaTarget'),z=qs('tapZone');const move=()=>{b.style.left=(5+Math.random()*82)+'%';b.style.top=(5+Math.random()*70)+'%'};b.onclick=()=>{add(10);nextTurn();move()};move()}
function runReact(area,add,nextTurn){area.innerHTML='<div class="instruction">Wait for GO. False starts lose points.</div><button id="megaReact" class="mega-react">WAIT</button>';const b=qs('megaReact');let ready=false,tid;const cycle=()=>{ready=false;b.textContent='WAIT';clearTimeout(tid);tid=setTimeout(()=>{ready=true;b.textContent='GO'},700+Math.random()*1700)};b.onclick=()=>{if(!ready){add(-5);cycle()}else{add(15);nextTurn();cycle()}};cycle();gameCleanup=()=>clearTimeout(tid)}
function runMemory(area,add,nextTurn){let seq=[];area.innerHTML='<div class="instruction">Memorize the sequence, then type it.</div><div id="megaSeq" class="mega-seq"></div><input id="megaInput" class="mega-input" inputmode="numeric" placeholder="Example: 2413"><button class="btn soft" id="megaCheck">Check</button>';const show=()=>{seq=Array.from({length:3+Math.min(4,Math.floor(Math.random()*3))},()=>1+Math.floor(Math.random()*4));qs('megaSeq').textContent=seq.join(' · ');setTimeout(()=>{if(qs('megaSeq'))qs('megaSeq').textContent='? · ? · ?'},1000)};qs('megaCheck').onclick=()=>{if(qs('megaInput').value.replace(/\D/g,'')===seq.join('')){add(20);nextTurn();show()}else{add(-5);show()}};show()}
function runFocus(area,add){const target=['◆','●','★','■'][Math.floor(Math.random()*4)];area.innerHTML='<div class="instruction">Click only <b>'+target+'</b>.</div><div class="focus-wall" id="focusWall"></div>';for(let i=0;i<36;i++){const b=document.createElement('button');b.className='focus-cell';b.textContent=['◆','◇','●','○','★','■'][Math.floor(Math.random()*6)];b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.textContent===target?add(5):add(-3)};qs('focusWall').appendChild(b)}}
function runMath(area,add,nextTurn){const newQ=()=>{const x=1+Math.floor(Math.random()*20),y=1+Math.floor(Math.random()*20),ops=['+','-','×'],op=ops[Math.floor(Math.random()*3)],ans=op==='+'?x+y:op==='-'?x-y:x*y;area.innerHTML='<div class="math-q">'+x+' '+op+' '+y+' = ?</div><input id="mathInput" class="mega-input" inputmode="numeric"><button class="btn primary" id="mathBtn">Submit</button>';qs('mathBtn').onclick=()=>{if(Number(qs('mathInput').value)===ans){add(10);nextTurn()}else add(-2);setTimeout(newQ,250)}};newQ()}
function runWord(area,add,nextTurn){const words=['CALM','FOCUS','BREATHE','RESET','PAUSE','SMILE','BALANCE','QUIET','MOMENT','ENERGY'];const newQ=()=>{const w=words[Math.floor(Math.random()*words.length)],sh=w.split('').sort(()=>Math.random()-.5).join('');area.innerHTML='<div class="math-q">Unscramble: <b>'+sh+'</b></div><input id="wordInput" class="mega-input"><button class="btn primary" id="wordBtn">Submit</button>';qs('wordBtn').onclick=()=>{if(qs('wordInput').value.trim().toUpperCase()===w){add(12);nextTurn()}else add(-2);setTimeout(newQ,250)}};newQ()}
function runPattern(area,add,nextTurn){const newQ=()=>{const base=1+Math.floor(Math.random()*5),step=1+Math.floor(Math.random()*4),arr=[base,base+step,base+2*step,base+3*step];area.innerHTML='<div class="math-q">'+arr.join(' · ')+' · ?</div><input id="patInput" class="mega-input" inputmode="numeric"><button class="btn primary" id="patBtn">Submit</button>';qs('patBtn').onclick=()=>{if(Number(qs('patInput').value)===arr[3]+step){add(15);nextTurn()}else add(-2);setTimeout(newQ,250)}};newQ()}
function runColor(area,add){const colors=[['RED','red'],['BLUE','blue'],['GREEN','green'],['YELLOW','#b18a00']];const newQ=()=>{const word=colors[Math.floor(Math.random()*4)],ink=colors.filter(x=>x[0]!==word[0])[Math.floor(Math.random()*3)];area.innerHTML='<div class="color-word" style="color:'+ink[1]+'">'+word[0]+'</div><p class="mut" style="text-align:center">Click the ink color, not the word.</p><div class="choicegrid">'+colors.map(x=>'<button class="choice" onclick="colorAnswer(\''+x[0]+'\',\''+ink[0]+'\')">'+x[0]+'</button>').join('')+'</div>'};window.colorAnswer=(pick,ans)=>{pick===ans?add(12):add(-4);setTimeout(newQ,250)};newQ()}
function runNumber(area,add,nextTurn){const newQ=()=>{const n=String(Math.floor(1000+Math.random()*9000));area.innerHTML='<div class="math-q" id="numShow">'+n+'</div><input id="numInput" class="mega-input" inputmode="numeric"><button class="btn primary" id="numBtn">Check</button>';setTimeout(()=>{if(qs('numShow'))qs('numShow').textContent='••••'},900);qs('numBtn').onclick=()=>{qs('numInput').value===n? (add(15),nextTurn()):add(-3);setTimeout(newQ,250)}};newQ()}
function runCalm(area,add){let count=5;area.innerHTML='<div class="calm-circle" id="calmCircle">'+count+'</div><p class="mut" style="text-align:center">Tap when the circle reaches zero. Slow is okay.</p>';const iv=setInterval(()=>{if(!qs('calmCircle')){clearInterval(iv);return}count--;qs('calmCircle').textContent=Math.max(0,count);if(count<=0){clearInterval(iv);add(20);setTimeout(()=>{count=5;runCalm(area,add)},600)}},700);gameCleanup=()=>clearInterval(iv)}
function resetGameRuntime(){if(gameTimer){clearInterval(gameTimer);gameTimer=null}if(gameCleanup){try{gameCleanup()}catch{}gameCleanup=null}}

async function dash(){
  qs('main').innerHTML='<section class="view"><div class="wrap"><div class="head"><span class="ey">DASHBOARD</span><h2>Small progress still counts.</h2></div><div class="stats"><div class="card"><strong id="s1">—</strong><span class="small">Check-ins</span></div><div class="card"><strong id="s2">—</strong><span class="small">Chat messages</span></div><div class="card"><strong id="s3">—</strong><span class="small">Meditation minutes</span></div><div class="card"><strong>120</strong><span class="small">Game variations</span></div></div></div></section>';
  try{const d=await api('/api/dashboard/'+user.id,{},12000);if(qs('s1'))qs('s1').textContent=d.checkins??0;if(qs('s2'))qs('s2').textContent=d.chat_messages??0;if(qs('s3'))qs('s3').textContent=d.meditation_minutes??0}catch{}
}
function profile(){
  const lang=window.appLanguage||user.language||'English',avatar=user.avatar||'🌿';
  qs('main').innerHTML='<section class="view"><div class="wrap"><div class="head"><span class="ey">PROFILE</span><h2>Make Small Steps feel like yours.</h2></div><div class="profile"><div class="card"><h3>Profile</h3><div style="font-size:60px;margin:8px 0">'+avatar+'</div><div class="field"><label>Name</label><input id="pn" value="'+esc(user.full_name||'')+'"></div><div class="field"><label>Email</label><input value="'+esc(user.email||'')+'" disabled></div><button class="btn primary" onclick="saveProfile()">Save profile</button></div><div class="card"><h3>Choose avatar</h3><div class="avatar-grid">'+AVATARS.map(x=>'<button class="avatar '+(x===avatar?'sel':'')+'" onclick="selectProfileAvatar(\''+x+'\',this)">'+x+'</button>').join('')+'</div><div class="field"><label>Language</label><select id="lang">'+LANGS.map(x=>'<option '+(x===lang?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Preferred meditation time</label><select id="mt"><option>Morning</option><option>Afternoon</option><option>Night</option><option>Not set</option></select></div><button class="btn soft" onclick="savePrefs()">Save preferences</button></div><div class="card"><h3>Change password</h3><div class="field"><label>Current password</label><input id="old" type="password"></div><div class="field"><label>New password</label><input id="np" type="password"></div><button class="btn primary" onclick="changePw()">Change password</button><p class="small">Password is never stored in localStorage.</p></div></div></div></section>';
}
function selectProfileAvatar(a){user.avatar=a;saveSession();profile();toast('Avatar updated.')}
async function saveProfile(){try{const d=await api('/api/profile/'+user.id,{method:'PUT',body:JSON.stringify({full_name:qs('pn').value})});user=d.user||{...user,full_name:qs('pn').value};saveSession();toast('Profile saved.')}catch(e){user.full_name=qs('pn').value;saveSession();toast('Saved locally; backend update was unavailable.');}}
async function savePrefs(){const language=qs('lang').value,meditation_time=qs('mt').value;window.appLanguage=language;user.language=language;saveSession();try{await api('/api/preferences/'+user.id,{method:'PUT',body:JSON.stringify({language,meditation_time})});toast('Preferences saved.')}catch{toast('Saved locally. Backend preference sync is currently unavailable.');}}
async function changePw(){try{await api('/api/change-password',{method:'POST',body:JSON.stringify({user_id:user.id,old_password:qs('old').value,new_password:qs('np').value})});toast('Password changed.')}catch(e){toast(e.message)}}

function showIntroTour(force=false){
  if(!force&&localStorage.getItem(INTRO_KEY))return;
  let slide=0;const data=[
    ['🌿','Check in','Tell Small Steps how you are feeling and get one focused recommendation.'],
    ['💬','Talk with Mio','Write or speak. Mio can listen, ask questions and suggest a small next step.'],
    ['🎮','Play & reset','Use short mental games, calming activities or music when you need a break.'],
    ['👤','Make it yours','Pick your language, avatar and preferences from Profile.']
  ];
  const render=()=>{document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="tourOverlay"><div class="tour"><div class="tour-art">'+data[slide][0]+'</div><h2>'+data[slide][1]+'</h2><p class="mut">'+data[slide][2]+'</p><div class="tour-dots">'+data.map((_,i)=>'<i class="'+(i===slide?'on':'')+'"></i>').join('')+'</div><div class="actions"><button class="btn soft" onclick="skipTour()">Skip</button>'+(slide>0?'<button class="btn soft" onclick="tourBack()">Back</button>':'')+(slide<data.length-1?'<button class="btn primary" onclick="tourNext()">Next</button>':'<button class="btn primary" onclick="finishTour()">Start Small Steps</button>')+'</div></div></div>');window.__tourData=data;window.__tourSlide=slide};
  window.tourNext=()=>{slide=Math.min(data.length-1,slide+1);qs('tourOverlay')?.remove();render()};window.tourBack=()=>{slide=Math.max(0,slide-1);qs('tourOverlay')?.remove();render()};window.skipTour=()=>{localStorage.setItem(INTRO_KEY,'1');qs('tourOverlay')?.remove()};window.finishTour=()=>{localStorage.setItem(INTRO_KEY,'1');qs('tourOverlay')?.remove()};render();
}
function warmBackend(){fetch(API+'/docs',{method:'GET',cache:'no-store'}).catch(()=>{});}
function toast(msg){const d=document.createElement('div');d.style='position:fixed;right:18px;bottom:18px;z-index:200;background:#123b34;color:white;padding:13px 16px;border-radius:13px;box-shadow:0 15px 40px #0002;font-size:13px;max-width:360px';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),4000);}
function logout(){stopAudio();resetGameRuntime();speechSynthesis?.cancel();clearSession();user=null;viewHistory=[];currentView='home';auth(0,{});}

(function boot(){
  const s=loadSession();
  if(s?.user){user=s.user;window.appLanguage=s.language||user.language||'English';window.smallStepsTime=s.time_spend||'10 minutes';app();}
  else auth();
})();
</script>
